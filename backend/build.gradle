plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.botfunnel'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.mongodb:mongodb-driver-sync'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.session:spring-session-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'io.micrometer:micrometer-core'
	implementation 'org.jobrunr:jobrunr-spring-boot-3-starter:7.3.2'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:mongodb'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'ch.martinelli.oss:testcontainers-mailpit:1.3.1'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacocoTestReport {
	dependsOn test
}

tasks.named('test') {
	useJUnitPlatform {
		// @Tag("slow") covers the AC1 P99 latency probe — see TelegramWebhookControllerIT.
		// Excluded from default `gradlew test` because cold-JVM workstation timing is too
		// flaky to enforce <100ms; pre-deploy QA (T15) runs the slow tag explicitly via
		// `-PrunSlow=true` to validate the SLA before merge.
		if (!project.hasProperty('runSlow')) {
			excludeTags 'slow'
		}
	}
}
