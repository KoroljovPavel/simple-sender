notes: |
  - Canvas was explicitly Out-of-Scope on MVP (project.md), now activated as Phase 9.
  - Phase 2 already minted the graph data model (stable step ids + next/button target edges +
    fan-in/loops) precisely to enable a future canvas — no tree->graph migration needed.
  - ux-guidelines "Funnel Editor" says vertical list / no canvas — will need updating post-feature.
  - Open: node POSITIONS need persistence (new field on funnel/step?) — likely the ONLY backend change.
  - DECIDED: list editor -> read-only; canvas sole edit surface (may delete list later).
  - DECIDED: positions per-step nullable {x,y}; dagre auto-layout fallback.
  - DECIDED: reuse step forms in side-panel; add editor-only note node.
  - OPEN (Cycle 2): note node must NOT be an executable StepType — store as funnel-level notes[]
    (editor-only, never in execution graph) OR a StepType the engine ignores. Decide in Cycle 2.
  - OPEN (Cycle 2): edge creation UX maps to which field — next vs button.targetStepId vs timeout;
    deleting a node must clean up dangling targets pointing at it.

  CODE-RESEARCH FINDINGS (code-research.md, agent done):
  - Backend is NOT a one-line change: per-step position touches 5 spots (FunnelStep field+accessors,
    copyOf, FunnelStepDto record, toSteps forward map, toStepDto reverse map) + a round-trip IT.
    Still nullable -> no migration (Decision 4). FunnelStepDto has @JsonIgnoreProperties(ignoreUnknown)
    so an un-added position is SILENTLY DROPPED — must add to record + BOTH mappers.
  - NAME COLLISION: "position" already = step ORDER (array index). Use `canvasPosition`.
  - CRITICAL: `next` has NO UI today — flow is implicit ARRAY ORDER (next=null => fall through to next
    step in list). Backend rewrites `order` from array index. Canvas is id-addressed, list is
    index-addressed. => Decide: make `next` explicit on canvas, or keep implicit array-order fallthrough
    (canvas derives array order by insertion or y). THIS IS Q9.
  - Edges only to SAVED nodes (id minted on first PATCH). New dropped node must persist to mint id
    before it can be wired. null (not "") = no edge, else 422 funnel_broken_edge.
  - SUBSCRIBE cross-funnel edge (targetEntryStepId) points into ANOTHER funnel -> render as terminal
    "exit" badge, not a drawn edge.
  - Vue Flow SSR: wrap in <ClientOnly> or *.client.vue (none exist yet); import @vue-flow/core CSS.
  - dagre must lay out the whole forest (orphans/disconnected subflows are valid Phase-8 drafts).
  - Vitest: mountSuspended + mockNuxtImport('useFunnelsStore'); funnel-editor.spec.ts (1162 lines) is
    the page-mount pattern; i18n parity gate (check-locales.mjs + required-keys.spec.ts).
  - Correction to Cycle-1 testing answer: a backend round-trip IT for canvasPosition IS in scope.
