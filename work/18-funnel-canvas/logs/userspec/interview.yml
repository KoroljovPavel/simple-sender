conversation_history:
  - question_num: 1
    topic: "Cycle 1 — scope, positions, edit surface, note node, testing"
    summary: >
      (1) List editor downgraded to READ-ONLY, canvas is sole edit surface, list may be removed later.
      (2) Positions stored per-step as nullable {x,y} (option a), dagre auto-layout for legacy/empty.
      (3) Reuse existing step forms in a side-panel (no editor rewrite); ADD an editor-only note node.
      (4) Testing: Vitest component tests + backend position serialization test; no new E2E; manual drag/zoom.
  - question_num: 2
    topic: "Cycle 2 — Q5-Q9 edges/notes/delete/palette/next + Start-node screenshot"
    summary: >
      Q5=a draw-to-connect typed handles. Q6=notes as funnel-level notes[] (outside steps). Q7=auto-clean
      dangling edges on delete + warning. Q8=palette = existing step types + trigger + note (nothing new).
      Q9=a explicit next (array order stops driving step-to-step flow). User shared competitor screenshot:
      a dedicated "Початковий Крок" Start node (on_start entry) with explanatory copy + single output
      handle "Перший крок" -> first step; copy notes the flow can also be entered via triggers/events.
      Defaults accepted: new node persists to mint id before wiring; SUBSCRIBE cross-funnel = exit badge;
      broken edges highlighted.
  - question_num: 3
    topic: "Cycle 2 close — Start node + cycles"
    summary: >
      A confirmed: Start node optional ("Початковий Крок"), its single output edge = on_start entry step;
      trigger-only funnels have no Start node. on_start entry mechanism (array[0] vs explicit entryStepId)
      is a tech-spec detail. B confirmed: cycles allowed (engine backstops unchanged); exactly one default
      `next` per node, one edge per source handle, each button its own target.
  - question_num: 4
    topic: "Validation round 1 — critical null-next gap"
    summary: >
      Adequacy validator (changes_required) found CRITICAL: next==null is array-order fallthrough in
      FunnelExecutionEngine.advanceToNext (confirmed L488-501), not terminal — an unwired node would
      lie. Quality validator APPROVED (fixed: removed untestable 'reused without rewrite' AC; added
      Start-node lifecycle). User chose Variant 1: TWO bounded engine changes — advanceToNext treats
      null next as end-of-branch; resolveStartCursor enters on_start at the start-node edge target (not
      array[0]). Array order no longer affects execution. Added ACs + engine ITs + updated risks/decisions.

