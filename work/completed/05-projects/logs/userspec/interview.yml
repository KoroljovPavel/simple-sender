# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
phase2_user_experience:

  user_stories:
    score: 90
    status: "complete"
    value: |
      1. First-time user (post-register or post-login with 0 projects):
         Lands on /dashboard -> sees inline empty-state "Create your first project"
         (decided Q8: no separate onboarding page) -> opens create modal/page ->
         fills name + timezone (default: browser TZ) + optional description ->
         submits -> project created -> redirected to /dashboard with
         currentProjectId set in Pinia, normal dashboard rendered, selector
         shows project name.

      2. Returning user (>= 1 active project) starting a fresh session:
         Logs in -> /dashboard renders. Pinia store fetches active projects
         and auto-selects projects[0] (sorted createdAt desc). Selector
         displays it. No localStorage; user re-selects manually if they
         prefer a different one.

      3. Multi-project user switching within a session:
         Clicks selector -> dropdown shows all active projects sorted by
         createdAt desc -> selects another -> currentProjectId updates in
         the in-memory Pinia store, current page re-scopes (for now only
         /dashboard exists; future modules will observe the store).

      4. Project settings flow:
         Selector dropdown has "Project settings" link OR sidebar Settings
         entry when currentProject != null. Page allows: rename (409 on
         duplicate active name), edit description, change timezone. Save ->
         200 + updated project.

      5. Project soft-delete flow:
         Settings -> "Danger zone" section -> "Delete project" -> modal opens
         requiring user to type project name verbatim -> Delete button is
         disabled until match -> on confirm: DELETE /api/v1/projects/{id} ->
         200 -> project removed from active list, appears in "Recently
         deleted" section with N days remaining. If was currentProject,
         store auto-selects another active project (or empty-state if none).

      6. Project restore flow:
         /projects page "Recently deleted" -> Restore button -> POST
         /api/v1/projects/{id}/restore. Outcomes:
         - Active count < limit: 200, project returns to active list.
         - Active count == limit: 422 project_limit_reached (Q16 decision a)
           -> toast "Ліміт 5 активних досягнутий — видаліть один щоб
           відновити цей".
         - Name conflicts with an active project: server appends "(restored)"
           suffix automatically; UI shows informational toast.

      7. In-session stale state defense (Q10 simplified after localStorage
         dropped):
         If something external (other browser, API key, future feature)
         soft-deletes the current project mid-session, the next API call to
         /api/v1/projects/{currentProjectId}/* returns 404. The store's
         interceptor clears currentProjectId, refetches the project list,
         auto-selects another active, and shows a toast. No cross-tab events,
         no polling.
    gaps: ""
    required: true

  acceptance_criteria:
    score: 90
    status: "complete"
    value: |
      Backend (REST + persistence):
      AC1.  POST /api/v1/projects with {name=3-50 chars, timezone=IANA,
            optional description<=200} returns 201 with full Project body
            and emits `project_created` audit event.
      AC2.  POST /api/v1/projects with name length < 3 or > 50 returns 400
            with code `name_length`.
      AC3.  POST /api/v1/projects with timezone="GMT+5" or non-IANA returns
            400 with code `invalid_timezone`.
      AC4.  POST /api/v1/projects when user already has 5 ACTIVE projects
            returns 422 with code `project_limit_reached`.
      AC5.  POST /api/v1/projects with name matching another active project
            of the same owner returns 409 with code `project_name_taken`.
      AC6.  GET /api/v1/projects (no query) returns array of OWN active
            projects only, sorted by createdAt desc.
      AC7.  GET /api/v1/projects?include_deleted=true returns active +
            soft-deleted projects (each row carries deletedAt).
      AC8.  GET /api/v1/projects/{foreign-id} returns 404.
      AC9.  GET /api/v1/projects/{malformed-id} returns 404 (uniform).
      AC10. GET /api/v1/projects/{soft-deleted-own-id} returns 404 by default;
