        ...) nest under /api/v1/projects/{projectId}/...

      Backend:
      - REST. Project CRUD: GET /api/v1/projects, POST, GET {id}, PATCH {id},
        DELETE {id}, POST {id}/restore.
      - Access guard as method on ProjectService: `requireOwned(ownerId, id)`
        returns Mono<Project> or AppException.notFound. Future modules'
        services inject ProjectService and call requireOwned before any work.
      - 404 uniform for all "not yours / not found" cases (anti-enumeration).
      - 409 for active-name conflict on create/rename.
      - 422 for limit-reached on CREATE and RESTORE (Q16 decision a).
      - Bean-validation errors -> 400 with `code` field per existing
        GlobalErrorHandler contract.
      - AppException.notFound(...) factory added to common.
      - WithMockAppUser test annotation moved from profile/ to a shared
        testsupport package (third consumer threshold reached).

      Soft-delete & cron:
      - deletedAt: Instant or null (null = active).
      - JobRunr @Recurring "hard-delete-projects" daily at 03:00 UTC.
      - Cascade scope today: delete project document + delete events with
        metadata.projectId in deleted set. Future epics register their own
        cleanup mechanism — not over-engineered now.

      Validation:
      - @Size(min=3, max=50) on name, @Size(max=200) on description (no
        custom annotation needed).
      - @ValidTimezone with strict IANA gate via
        ZoneId.getAvailableZoneIds().contains(tz).

      Frontend:
      - Pinia store frontend/stores/projects.ts — IN-MEMORY ONLY. No
        localStorage (Q-localstorage-rework). On each fresh session start,
        auto-select projects[0] sorted createdAt desc.
      - 404 interceptor on /api/v1/projects/{currentProjectId}/* clears
        currentProjectId, refetches list, auto-selects again, toast.
      - No /onboarding page — dashboard handles 0-project empty-state inline.
      - One Playwright golden-path E2E spec.

      Concurrency:
      - Last-write-wins on rename/update (Q12). No @Version, no If-Match. To
        be revisited if collaboration / multi-owner epic ever ships.
    gaps: ""
    required: false

  deploy_approach:
    score: 90
    status: "complete"
    value: |
      Approach: same GitHub Actions CI/CD as existing modules
      (build -> tests -> deploy on merge to main). Per CLAUDE.md: ALL deployments
      via GitHub CI/CD only.

      Configuration changes:
      - .env.example adds PROJECTS_MAX_PER_USER=5.
      - application.properties: app.projects.max-per-user=${PROJECTS_MAX_PER_USER:5}.
      - No new GitHub secrets required (no third-party API).

      Database:
      - Mongo collection `projects` auto-created on first insert.
      - Indexes auto-created at startup via auto-index-creation=true (dev).
        Production index management is a deploy-prep epic concern — flagged but
        NOT in this feature's scope.
      - No data migrations.

      Background jobs:
      - JobRunr `hard-delete-projects` recurring job auto-registers via
        @Recurring at boot. Multi-replica safe via JobRunr distributed lock.

      Pre-deploy checks (gated in CI):
      - gradle test (unit + integration with Testcontainers)
      - pnpm test (vitest)
      - pnpm build (locale parity gate + Nuxt build)
      - pnpm test:e2e (Playwright golden path)
    gaps: ""
    required: false

  manual_user_actions:
    score: 90
    status: "complete"
    value: |
      ZERO manual user actions for the platform owner (deployer):
      - No third-party API setup (no Telegram bot for THIS feature; that's 04-bots).
      - No external secret rotation.
      - No SQL migration scripts to run.
      - No DNS / proxy changes.

      For the END USER of the platform:
      - On first login post-deploy, user lands on /dashboard which now shows
