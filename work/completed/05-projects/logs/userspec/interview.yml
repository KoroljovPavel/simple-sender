      AC27. `pnpm test` (vitest) is green.
      AC28. `pnpm test:e2e` (Playwright golden path) is green.
      AC29. `pnpm build` is green (locale parity gate enforced).

      UI limit enforcement (workflow MUST HAVE):
      AC30. When `projectsStore.projects.length >= 5`, the "+ Create new
