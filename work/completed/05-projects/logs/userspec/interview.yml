conversation_history:
  - question_num: 1
    timestamp: "2026-05-09 19:25:00"
    topic: "cascade_scope"
    agent_question: |
      Workflow lists "bot, subscribers, funnels, broadcasts, keys, events" as cascade
      targets, but only `events` exists today. Three options proposed: (a) ship only
      `projects` collection; child epics own their own cleanup. (b) pre-create empty
      schemas. (c) single coordinator job with hardcoded list.
      I propose (a) + delete events by metadata.projectId in this epic.
    user_answer: "Згоден"
    summary: |
      Decision: option (a). This feature ships ONLY the `projects` collection +
      cleanup of `events` (the only existing project-scoped collection).
      Child epics (04..09) take responsibility for cleaning up their own collections
      when they ship. Most likely via domain event "ProjectHardDeleted" subscribed
      to by each module — final mechanism deferred to tech-spec.

  - question_num: 2
    timestamp: "2026-05-09 19:25:00"
    topic: "soft_delete_and_limit"
    agent_question: |
      User has 5 active projects, soft-deletes one — can they create a 6th
      immediately, or wait 7 days? Should soft-deleted reserve the name?
    user_answer: |
      soft-видалив один → може створити 6-й одразу, soft-deleted взагалі не блокують
      ім'я — на UI просто не показуються, відновлення додає (restored) суфікс
    summary: |
      Decisions:
      - soft-deleted projects DO NOT count toward the 5-project limit
      - soft-deleted projects DO NOT reserve their name
      - soft-deleted projects are hidden from UI (selector, list)
      - on restore: if name conflicts with an active project, append "(restored)"
        suffix to the restored project's name automatically (no user prompt)

  - question_num: 3
    timestamp: "2026-05-09 19:25:00"
    topic: "forbidden_status_code"
    agent_question: |
      Workflow says 403 on foreign project access; I propose 404 (don't leak
      existence of the project). Which?
    user_answer: "404"
    summary: |
      Decision: 404 instead of 403. Applies to all "not yours" cases:
      - foreign project ID
      - soft-deleted project (treated as not-found from user perspective)
      - hard-deleted / never-existed
      - malformed project ID (also 404, not 400 — keeps the fact of the resource opaque)
      Active session is required (otherwise 401), but inside session 404 is uniform
      for "no such project for you".

  - question_num: 4
    timestamp: "2026-05-09 19:25:00"
    topic: "testing_strategy"
    agent_question: |
      Proposed: Unit (limit logic, timezone validation, perm-check helper);
      Integration (CRUD, owner-checks, limit enforcement, soft-delete + cron,
      session integration via WebTestClient + real Mongo per patterns.md);
      E2E one Playwright spec — onboarding -> create -> switch -> settings -> delete.
    user_answer: "Ок"
    summary: |
      Approved testing pyramid:
      - Unit: limit math, timezone validation, owner-check helper
      - Integration: full backend stack with real Mongo (per patterns.md), covers
        all CRUD endpoints, 401/404 enforcement, 5-project cap, soft-delete + cron
        hard-delete, session-bound currentUser
      - E2E: 1 Playwright spec, golden path: empty-state onboarding -> create
        first project -> create second -> switch via dropdown -> rename in settings
        -> delete with name-typing confirmation
      - No locale-specific E2E (covered by 03-i18n)

  - question_num: 5
    timestamp: "2026-05-09 19:35:00"
    topic: "primary_use_case"
    agent_question: |
      Three audiences captured: multi-brand business, agencies, devs. Which is
      THE primary driver for "Зачем" section?
    user_answer: "#1 мульти-бренд primary"
    summary: |
      Primary use-case: small business owners running multiple brands need to keep
      audiences and funnels isolated per brand. Agencies and devs are secondary
      audiences but get the same value.

  - question_num: 6
    timestamp: "2026-05-09 19:35:00"
    topic: "name_uniqueness"
    agent_question: |
      Workflow doesn't specify uniqueness. Two active "Acme" projects break the
      selector. Propose: unique per-owner among ACTIVE projects; conflict -> 422
      `project_name_taken`.
    user_answer: "згоден"
    summary: |
      Decision: project name MUST be unique per-owner among ACTIVE (non-soft-deleted)
      projects. Soft-deleted projects do not block names (consistent with Q2).
      Conflict on create or rename returns 422 with code `project_name_taken`.

  - question_num: 7
    timestamp: "2026-05-09 19:35:00"
    topic: "timezone_validation"
    agent_question: |
      Propose: IANA format, backend validates via ZoneId.of() -> 422
      `invalid_timezone` on bad input. Frontend dropdown via
      Intl.supportedValuesOf('timeZone'). Default: browser timezone.
    user_answer: "IANA + ZoneId.of()"
    summary: |
      Decisions:
      - Timezone field accepts IANA names only ("Europe/Kyiv", "America/New_York")
      - Backend validation via java.time.ZoneId.of(); on DateTimeException returns
        422 with code `invalid_timezone`
      - Frontend timezone picker uses Intl.supportedValuesOf('timeZone') for the
        list (works in Nuxt SSR, no extra library)
      - Default value at create-time: Intl.DateTimeFormat().resolvedOptions().timeZone
        from the browser; user can override

  - question_num: 8
    timestamp: "2026-05-09 19:50:00"
    topic: "onboarding_flow"
    agent_question: |
      Three options for 0-projects flow: (a) dashboard inline empty-state, (b)
      separate /onboarding page with redirect, (c) /projects page handles both.
      Recommend (a).
    user_answer: "Згоден за a"
    summary: |
      Decision: dashboard.vue handles 0-projects state inline. When
      projectsStore.projects.length === 0, dashboard renders the "Create your first
      project" call-to-action; when >= 1, dashboard renders the normal welcome /
      stats view. No separate /onboarding page. No redirect.

  - question_num: 9
    timestamp: "2026-05-09 19:50:00"
    topic: "restore_ui_and_list_endpoint"
    agent_question: |
      Two ways to expose soft-deleted projects for restore: (a) GET
      /api/v1/projects?include_deleted=true returns active+soft-deleted, frontend
      filters; (b) separate /api/v1/projects/deleted endpoint. Recommend (a) with
      a "Recently deleted" section at the bottom of /projects.
    user_answer: "Згоден"
    summary: |
      Decisions:
      - Single endpoint: GET /api/v1/projects (default: active only).
      - Query param `?include_deleted=true` returns active + soft-deleted in one
        list (each row carries `deletedAt`: null = active, instant = soft-deleted).
      - UI: /projects page renders "Active" section + "Recently deleted (X days
        until permanent removal)" section below; restore button per soft-deleted row.
      - Backend handler scopes ownership the same way as default; no separate route.
      - Restore: POST /api/v1/projects/{projectId}/restore -> 200 + restored
        Project body. If name conflicts with an active project, append "(restored)"
        suffix automatically (decided in Q2).

  - question_num: 10
    timestamp: "2026-05-09 19:50:00"
    topic: "cross_tab_soft_delete"
    agent_question: |
      User has two tabs open. Soft-deletes project A in tab X; tab Y still has
      currentProjectId=A in localStorage and renders. Two options: (a) any API
      call with deleted projectId returns 404, frontend resets currentProjectId
      and auto-selects another or onboarding; (b) Pinia heartbeat polling.
      Recommend (a).
    user_answer: "Згоден"
    summary: |
      Decisions:
      - Stale-tab handling: 404 from API on deleted projectId is the trigger.
      - Frontend interceptor on 404 for /api/v1/projects/{currentProjectId}/...:
        clear currentProjectId from store + localStorage, refetch project list,
        auto-select first active project if any (else show empty-state),
        toast "Цей проект був видалений в іншій вкладці" / "This project was
        deleted in another tab".
      - Stale selector dropdown: same handling — switching to a project that no
        longer exists triggers refetch + toast, no fragile pre-flight check.
      - No polling, no websockets — 404 is the source of truth.

  - question_num: 11
    timestamp: "2026-05-09 19:50:00"
    topic: "verification_strategy"
    agent_question: |
      Proposed AVP: Playwright MCP for golden path; curl for limit/404/401 edge
      cases; MongoDB MCP for collection/index inspection; manual JobRunr
      dashboard check for recurring job registration.
    user_answer: "згоден"
    summary: |
      Approved AVP for post-deploy verification:
      1. Playwright MCP — golden path: register fresh user -> onboarding visible
         -> create first project -> selector shows it -> create second -> switch
         via dropdown -> rename in settings -> soft-delete with name typing ->
         restore from "Recently deleted" section.
      2. curl: 6th project returns 422 + code project_limit_reached; foreign /
         malformed projectId returns 404; no-session call returns 401.
      3. MongoDB MCP query: confirm `projects` collection exists with one document
         after create; deletedAt is null on active; service-level uniqueness
         enforced (try insert duplicate active name -> 422 from API).
      4. Manual: open JobRunr dashboard at /jobrunr-dashboard, confirm recurring
         job `hard-delete-projects` is registered with cron `0 3 * * *`.
      Pre-deploy QA covers: full unit + integration test runs; Playwright golden
      path on local stack; manual check that index spec was applied
      (auto-index-creation=true in dev resolves it).

  - question_num: 12
    timestamp: "2026-05-09 20:05:00"
    topic: "concurrent_rename"
    agent_question: |
      MongoDB no optimistic locking by default. Two-tab concurrent rename ->
      last-write-wins. Acceptable for MVP, or add @Version + If-Match?
    user_answer: "OK з last-write-wins"
    summary: |
      Decision: last-write-wins for rename and update on MVP. No optimistic
      locking, no @Version field, no warning toast on stale updatedAt. Document
      as conscious trade-off in user-spec; future "audit" or "collaboration"
      epic can add proper concurrency control.

  - question_num: 13
    timestamp: "2026-05-09 20:05:00"
    topic: "zoneid_strictness"
    agent_question: |
      ZoneId.of() permissive accepts "GMT+5", "+02:00" — non-IANA, no DST. For
      broadcast scheduling we want IANA only. Recommend strict gate via
      ZoneId.getAvailableZoneIds().contains(tz).
    user_answer: "Згоден"
    summary: |
      Decision: ValidTimezoneValidator gates strictly:
      `if (!ZoneId.getAvailableZoneIds().contains(tz)) return false;`
      Rejects "GMT+5", "+02:00", "UTC" (which is IANA-listed but acceptable;
      double-check: ZoneId.getAvailableZoneIds() does include "UTC"). On reject
      backend returns 422 with code `invalid_timezone`. Frontend dropdown is
      already restricted to Intl.supportedValuesOf('timeZone'), so legitimate
      flows never trigger this error.

  - question_num: 14
    timestamp: "2026-05-09 20:05:00"
    topic: "deploy_approach"
    agent_question: |
      Proposed deploy: env var PROJECTS_MAX_PER_USER (default 5); JobRunr
      auto-registers recurring job; Mongo auto-index-creation=true in dev,
      manual in prod (deferred to deploy-prep epic); no migrations; no manual
      user actions.
    user_answer: "Згоден"
    summary: |
      Deploy plan:
      - .env.example adds PROJECTS_MAX_PER_USER=5; application.properties uses
        ${PROJECTS_MAX_PER_USER:5}.
      - Spring Data MongoDB auto-creates indexes at startup
        (auto-index-creation=true in dev). Production index management is a
        deploy-prep epic concern, NOT this feature.
      - JobRunr `hard-delete-projects` recurring job registers at boot via
        @Recurring annotation. Multi-replica safe via JobRunr distributed lock.
      - Mongo collection `projects` is created on first insert (no DDL needed).
      - No data migrations — new collection, new endpoints, no changes to
        existing models.
      - Zero manual user actions. No third-party API setup, no token rotation.
      - GitHub Actions CI/CD: same path as existing modules
        (build -> tests -> deploy).

  - question_num: 15
    timestamp: "2026-05-09 20:05:00"
    topic: "risks_list"
    agent_question: |
      Proposed 6 risks: data leakage (HIGH), hard-delete-vs-restore race (LOW),
      Mongo partial unique not supported (MEDIUM), localStorage drift (LOW),
      JobRunr 03:00 collision (LOW), mass-assignment (MEDIUM). Each with
      mitigation. Confirm/extend.
    user_answer: "Згоден"
    summary: |
      Risk register approved as-listed at the time. Risk #4 (localStorage drift)
      later REMOVED in Q-localstorage-rework when localStorage was dropped from
      scope.

  - question_num: 16
    timestamp: "2026-05-09 20:25:00"
    topic: "restore_vs_limit"
    agent_question: |
      User has 5 active + 1 soft-deleted; soft-deletes one (4 active + 2 sd);
      creates a new (5 active + 2 sd allowed); now wants to restore one of the
      soft-deleted -> would yield 6 active. Three options: (a) 422 on restore
      at limit; (b) allow always; (c) auto-displace oldest active.
    user_answer: |
      Давай зараз a, а потім ми зробимо щоб користувач міг більше активних
      проектів мав, коли якщо зайде і це монетизується
    summary: |
      Decision: option (a). On POST /api/v1/projects/{id}/restore the backend
      counts active projects for ownerId; if count >= app.projects.max-per-user
      it returns 422 with code project_limit_reached (same code as create-flow
      limit). UI shows error: "ліміт активних проектів досягнутий, видаліть
      один з активних щоб відновити цей".

      Future direction (out of scope here, recorded for product roadmap):
      paid plans will raise the per-user active-project cap. The current
      app.projects.max-per-user constant is the V1 mechanism; per-user
      configurable limits move into the future billing/plans epic.

  - question_num: "localstorage-rework"
    timestamp: "2026-05-09 20:25:00"
    topic: "drop_localstorage_for_currentProjectId"
    agent_question: |
      You questioned whether localStorage was load-bearing. After thinking it
      through: localStorage primary value is cross-restart persistence
      (different from Pinia in-memory and from cookie session). Cross-tab sync
      was over-engineered. Two options proposed: (a) keep localStorage for
      cross-restart only; (b) drop localStorage entirely, auto-select on each
      session start.
    user_answer: |
      Тоді це тільки для логіна, "Запамʼятати мене" залишаємо. Все інше в
      localStorage якщо явно воно не потрібно, то не потрібно.
    summary: |
      Decision: DROP localStorage for currentProjectId on MVP.
      - Pinia store frontend/stores/projects.ts is in-memory only. After tab/
        browser close, currentProjectId is gone.
      - On every fresh session/page load with >= 1 project: auto-select
        projects[0] sorted by createdAt desc (most-recently-created active).
      - 404 interceptor still exists as defensive reset for stale in-memory
        currentProjectId (e.g. project soft-deleted via API key in another
        client mid-session): on 404 from /api/v1/projects/{currentProjectId}/*,
        clear currentProjectId, refetch list, auto-select again.
      - No SSR gating concerns (no localStorage reads).
      - No cross-tab sync. Each tab is independent — multi-bot users actually
        prefer this (manage Acme in one tab, Brand X in another simultaneously).
      - Trade-off accepted: user with multiple projects who actively works in B
        will land on C (newest) on each browser restart and must re-select
        once per session.
      - This is a CONSCIOUS deviation from workflow/03-проекти/README.md line
        41 ("Останній обраний проект пам'ятається в localStorage"). The
        deviation is recorded in user-spec under "Conscious deviations from
        workflow doc" so future epic specs can reference it.

  - question_num: 17
    timestamp: "2026-05-09 20:45:00"
    topic: "acceptance_criteria_validation"
    agent_question: |
      Composite list of 29 testable AC presented; final confirmation requested.
    user_answer: "підтверджую"
    summary: |
      AC1..AC29 confirmed by user. AC30 added separately under Q18.

  - question_num: 18
    timestamp: "2026-05-09 20:45:00"
    topic: "ui_limit_acceptance_criterion"
