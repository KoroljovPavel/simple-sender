  - question_num: 19
    timestamp: "2026-05-09 20:45:00"
    topic: "ux_guidelines_pk_update"
    agent_question: |
      ux-guidelines.md PK still says localStorage persistence + full-page
      onboarding — both consciously changed. Update PK in this feature, or
