            list endpoint (single-resource GET stays 404 for cleanliness —
            user navigates from the list view).
      AC11. Any /api/v1/projects/* call without a session returns 401.
      AC12. PATCH /api/v1/projects/{id} with valid body returns 200 + updated
            project; emits `project_renamed` if name changed, else
            `project_updated`.
      AC13. DELETE /api/v1/projects/{id} returns 200, sets deletedAt=now,
            emits `project_soft_deleted`. Project disappears from default
            list, appears in ?include_deleted=true.
      AC14. POST /api/v1/projects/{id}/restore on a soft-deleted own project
            with active count < limit returns 200 + project with deletedAt
            cleared; emits `project_restored`. If name conflicts with an
            active project of the same owner, the restored project's name
            is automatically suffixed with " (restored)" before save.
      AC15. POST /api/v1/projects/{id}/restore when active count == limit
            returns 422 `project_limit_reached`.
      AC16. JobRunr `hard-delete-projects` recurring job is registered with
            cron `0 3 * * *` UTC.
      AC17. Hard-delete cron permanently removes projects where deletedAt <
            now-7d, and removes events with metadata.projectId in the deleted
            set. Emits `project_hard_deleted` event per deleted project (the
            event itself is per-user and is NOT removed).

      Frontend:
      AC18. Login with 0 projects -> /dashboard shows full-width
            "Create your first project" empty-state with a primary CTA.
      AC19. Login with >= 1 project -> /dashboard shows the welcome content;
