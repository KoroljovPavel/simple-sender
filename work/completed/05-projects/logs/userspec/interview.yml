    gaps: ""
    required: true

  ui_ux_requirements:
    score: 90
    status: "complete"
    value: |
      Topbar (default.vue):
      - Logo (left) | ProjectSelector dropdown | user name+avatar | Logout | LangSwitcher.
      - Selector: shows currentProject name; click -> dropdown of active
