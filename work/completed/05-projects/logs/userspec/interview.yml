    required: false

  risks:
    score: 90
    status: "complete"
    value: |
      1. [HIGH] Data leakage between projects (cross-user / cross-project
         access).
         Mitigation: ProjectService.requireOwned(ownerId, projectId) called at
         the entry of every project-scoped handler. Returns Mono<Project> on
         success, AppException.notFound otherwise. Integration test with two
         distinct users verifies 404 uniformly. Future epics that ship
         /api/v1/projects/{id}/* routes MUST plug into the same guard.

      2. [MEDIUM] Mass-assignment via unknown JSON fields (e.g. client posts
         "ownerId": "<other-user>"). Mitigation: every DTO carries
         @JsonIgnoreProperties(ignoreUnknown=true) — already standard per
         profile/dto. Service NEVER reads ownerId from request body.

      3. [MEDIUM] Mongo @CompoundIndex partial filter unsupported, so
         (ownerId, name) unique-among-active relies on service-layer
         pre-check (race window microseconds). Mitigation: low-collision per
         5-project cap; if observed in production, fall back to programmatic
         IndexOps.ensureIndex with partialFilterExpression.

      4. [LOW] Hard-delete vs restore race: cron deletes at the same instant
         user clicks Restore. Mitigation: 404 from POST /restore + toast.

      5. [LOW] JobRunr 03:00 cron collision with HardDeleteJob (users).
         Mitigation: JobRunr serializes; observable via dashboard.
    gaps: ""
    required: true

  technical_decisions:
    score: 90
    status: "complete"
    value: |
      Routing & versioning:
      - First /api/v1/... module. Existing /api/auth and /api/profile stay
