    required: true

  edge_cases:
    score: 90
    status: "complete"
    value: |
      Resolved:
      - 5 active + N soft-deleted -> 6th create allowed (soft-deleted not counted).
      - Cross-tab soft-delete -> 404 triggers store reset + auto-select + toast.
      - Restore name conflict -> server appends "(restored)" suffix automatically.
      - Stale selector -> switching to deleted -> 404 + refetch + toast.
      - Hard-delete fires while user is in restore flow: 404 on POST /restore
        -> same toast as cross-tab.
      - Concurrent rename in two tabs: last-write-wins, no warning. Documented
        as conscious MVP trade-off (no @Version, no If-Match).
      - Description empty string -> stored as null in Mongo (DTO-level normalization).
      - Restore of last-soft-deleted by user with 5 active: soft-deleted does
        not count, so restore always succeeds and may temporarily push user to
        6 active. Acceptable — limit gates CREATE only, not RESTORE.
    gaps: ""
    required: true

  error_scenarios:
    score: 90
    status: "complete"
    value: |
      Auth/access:
      - 401 if no active session
      - 404 uniform for: foreign project, soft-deleted project, malformed
        projectId, never-existed (uniformity = anti-enumeration)

      Validation (returned as 400 with `code` per code-research §1.7 — bean
      validation surfaces through GlobalErrorHandler as 400):
      - name missing / empty -> 400, code `name_required`
      - name length < 3 or > 50 -> 400, code `name_length`
      - description length > 200 -> 400, code `description_too_long`
      - timezone missing -> 400, code `timezone_required`
      - timezone not in IANA list -> 400, code `invalid_timezone`

      Business rules (custom service-thrown):
      - 6th project create -> 422, code `project_limit_reached`
        (note: backend uses 422 here intentionally — 400 is reserved for
        request-shape validation; 422 = semantically valid request rejected)
      - Active duplicate name on create or rename -> 409, code `project_name_taken`
      - Restore of project past 7-day grace -> 404 (record gone)

      UX consequences:
      - In-session stale current project on any 404: clear in-memory
        currentProjectId in Pinia, refetch list, auto-select another active,
        show toast (Q10 simplified after Q-localstorage-rework — no localStorage,
        no cross-tab events).
      - Delete requires typing project name verbatim; Delete button disabled
        until match.
      - Hard-delete-after-soft-delete: irreversible; no UI warning beyond the
        7-day countdown shown in "Recently deleted" list.
    gaps: ""
    required: true

  verification_strategy:
    score: 90
    status: "complete"
    value: |
      Pre-deploy (no live env):
      - Backend: full unit + integration suite (gradle test).
