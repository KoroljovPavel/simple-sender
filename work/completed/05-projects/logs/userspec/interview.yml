notes: |
  Source of requirements: workflow/03-проекти/README.md (read into Cycle 1 priors).
  Size: L (new backend module, cron, guard pattern, full UI).

  Conscious deviations from workflow doc, captured in the user-spec:
  - 403 -> 404 for ownership mismatch (anti-enumeration). Workflow says 403.
  - localStorage for currentProjectId DROPPED. Workflow says
    "Останній обраний проект пам'ятається в localStorage".
    On MVP: in-memory Pinia + auto-select most-recently-created on each session.
