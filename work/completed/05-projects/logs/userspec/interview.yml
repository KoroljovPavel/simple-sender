  - question_num: 20
    timestamp: "2026-05-09 20:45:00"
    topic: "minor_deferrals"
    agent_question: |
      Minor items folded as design defaults (not requiring explicit AC):
      - E2E user-seeding via UI register form (standard path, no fixtures)
      - UA copy for type-name modal: "Введіть «{name}» для підтвердження"
      - EN copy: "Type «{name}» to confirm"
    user_answer: "підтверджую"
    summary: |
      Implementation defaults captured (no explicit AC needed):
      - Playwright golden-path spec registers a fresh user via the UI's
        register form; no backend fixtures, no API-level seeding.
      - Delete-confirm modal copy keys: errors.projects.delete.confirmTypeName
        UA: "Введіть «{name}» для підтвердження"
        EN: "Type «{name}» to confirm"

  - question_num: 21
    timestamp: "2026-05-09 21:05:00"
    topic: "localstorage_revisit"
    agent_question: |
      Adequacy validator pushed back on full localStorage drop: argued the
      multi-brand persona (primary use-case Q5) needs cross-restart
      persistence. Earlier "no localStorage" was reaction to over-engineered
      cross-tab sync; cross-restart is a different (and legitimate) use.
      Two options: (a) keep in-memory only; (b) add minimal localStorage
      (~5-7 lines, import.meta.client gate, no cross-tab events).
    user_answer: "Окей, давай b"
    summary: |
      Decision: option (b). Re-introduce localStorage for cross-restart
      persistence ONLY.
      - Pinia store frontend/stores/projects.ts writes
        localStorage.setItem('bot-funnel.currentProjectId', id) on
        selectProject(id), gated by import.meta.client.
      - On fresh session: read localStorage; if value matches an active
        project in the fetched list, auto-select it; otherwise fallback to
        most-recently-created auto-select.
      - 404 interceptor on /api/v1/projects/{currentProjectId}/* also
        removes the localStorage key (defensive cleanup).
      - No 'storage' event listener; no cross-tab sync. Different tabs may
        hold different currentProjectId — accepted (multi-bot users
        actually want this).
      - This RESTORES alignment with workflow/03-проекти/README.md line 41
        ("Останній обраний проект пам'ятається в localStorage") and
        ux-guidelines.md line 43 — so the "PK update" scope shrinks: only
        line 33 (full-page onboarding -> inline empty-state) needs editing.
        AC-31 reflects updated scope.

