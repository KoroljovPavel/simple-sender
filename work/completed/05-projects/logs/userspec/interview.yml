# Phase 3: Integration & Technical Context
# ============================================================================
phase3_integration:

  integration_points:
    score: 90
    status: "complete"
    value: |
      Upstream dependencies:
      - 02-auth: authenticated session via spring-session-data-mongodb;
        currentUserId() extracted from ReactiveSecurityContextHolder; CSRF
        cookie/header pattern inherited automatically; auth.global.ts middleware
        unchanged (project routes resolve to known names, fail-closed for
        unauth).

      Outputs that future epics consume:
      - ProjectService.requireOwned(ownerId, projectId): Mono<Project> — the
        shared access guard. Future modules' services (BotService, SubscriberService,
        FunnelService, BroadcastService, ApiKeyService, AnalyticsService) inject
        ProjectService and gate every entry point through requireOwned.
      - URL contract: every project-scoped route nests under
        /api/v1/projects/{projectId}/... . The {projectId} path variable is the
        first argument every controller passes to the guard.
      - Event types: project_created, project_renamed, project_updated,
        project_soft_deleted, project_restored, project_hard_deleted (open enum
        in `events` collection). 04-bots and beyond extend with their own event
        types and may filter by metadata.projectId.
      - Hard-delete extension point: the `hard-delete-projects` JobRunr job
        currently cleans `events` by metadata.projectId. Each future epic that
        owns a project-scoped collection (bots, subscribers, funnels, etc.)
        registers its own cleanup hook in that epic — out of scope here.

      Frontend integration:
      - Pinia useProjectStore exposes currentProjectId — future page modules
        observe it and re-scope their queries.
      - useApi already CSRF-aware; no per-route work needed.
      - 404 interceptor (centralized in the project store) is the single
        cross-tab invalidation mechanism for currentProjectId.
    gaps: ""
    required: true

  dependencies:
    score: 80
    status: "partial"
    value: |
      Hard dep: 02-auth (User entity, session, brute-force protection patterns).
      Code reuse: events service (audit log), profile patterns (delete-with-confirmation).
    gaps: ""
    required: false

  technical_constraints:
    score: 85
    status: "complete"
    value: |
      Reactive stack only (WebFlux + reactive Mongo).
      Sessions in MongoDB via spring-session-data-mongodb.
      project_id always in URL path; never inferred from session on the backend.
      Timezone format: IANA ("Europe/Kyiv"); validated via java.time.ZoneId.of();
      DateTimeException -> 422 `invalid_timezone`.
      Name validation: 3-50 chars (workflow doc), trimmed, no leading/trailing whitespace.
      Description: optional, max 200 chars (workflow doc).
    gaps: ""
    required: false

  data_requirements:
    score: 90
    status: "complete"
    value: |
      New `projects` collection (Mongo document):
      - _id: ObjectId
      - ownerId: ObjectId (ref users._id) — required
      - name: string (3-50 chars), required, unique per-owner among non-soft-deleted
      - description: string (0-200 chars), optional
      - timezone: string (IANA name), required
      - deletedAt: instant or null — null means active; non-null means soft-deleted
      - createdAt, updatedAt: instants
      Indexes:
      - { ownerId: 1, deletedAt: 1 } — list queries (active vs all)
      - { ownerId: 1, name: 1 } UNIQUE PARTIAL where deletedAt is null —
        enforces unique name among ACTIVE only
      - { deletedAt: 1 } — cron query (find expired soft-deletes)
    gaps: ""
    required: false

  migration_needs:
    score: 70
    status: "partial"
    value: |
