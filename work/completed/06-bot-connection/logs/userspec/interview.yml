    required: true

# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
phase2_user_experience:

  user_stories:
    score: 85
    status: "complete"
    value: |
      US1 — First-time connect:
        As a project owner, I open Settings → Bot, paste my Telegram token from
        BotFather, click Connect, and see my bot's @username + first_name +
        masked token + Disconnect/Send Test buttons within 5 seconds.
      US2 — Verify it works:
        I send /start to my bot in Telegram from my own account, return to the
        app, click "Send Test Message", and receive "Bot connected ✅" in Telegram.
      US3 — Replace bot:
        I disconnect the current bot (confirm modal), paste a different token,
        click Connect, and the new bot replaces the old (a new bots document is
        created; old one stays disconnected for audit).
      US4 — Recover from bad token:
        I paste an invalid/revoked token; the form shows inline error "Token is
        invalid or revoked" without losing my input.
      US5 — Bot uniqueness:
        I try to connect a bot that's already connected to another of my projects
        (or another user's project); I see a 409 error "this bot is already
        connected to another project" without learning anything about that project.
    gaps: ""
    required: true

  acceptance_criteria:
    score: 95
    status: "complete"
    value: |
      AC list (testable, finalized; ordered by user flow):

      AC1. POST /api/v1/projects/{projectId}/bot/connect with valid token returns
        200 + {telegramBotId, telegramUsername, telegramFirstName, status:"connected",
        connectedAt}; bots document persisted with encryptedToken + webhookSecret +
        keyVersion=1. Response NEVER contains the raw or encrypted token.
      AC2. ConnectBotRequest.token field carries @Pattern("^\\d+:[A-Za-z0-9_-]{35}$").
        Tokens failing the pattern return 400 (bean-validation, no AppException)
        BEFORE any network call to Telegram. Frontend resolves errors.bot.connect.400.
      AC3. Token failing getMe (Telegram responds 401) returns 422 via
        AppException.unprocessableEntity("token_invalid", ...). Frontend resolves
        errors.bot.connect.422 = "Token is invalid or revoked". No bots document persisted.
      AC4. Telegram returns 5xx OR request times out on getMe OR setWebhook → 3 inline
        retries with 1s/2s/4s exponential backoff; after all 3 exhausted returns
        502 with code `telegram_unavailable`. Frontend resolves errors.bot.connect.502.
        No bots document persisted.
      AC5. Connecting a bot whose telegramBotId already has a bots document with
        status="connected" (own project, foreign project, soft-deleted project)
        returns 409 with code `bot_already_connected`. Generic message; response
        never reveals foreign project name/owner. Triggered by either service-level
        pre-check OR DuplicateKeyException on the partial unique index — both paths
        produce the same 409.
      AC6. Connect succeeds → side effects in this order: (a) getMe verified,
        (b) setWebhook called with secret, (c) document persisted. Failure at
        any step aborts the flow — the document is persisted ONLY if all three
        succeeded. No `pending_webhook` state exists in the schema.
      AC7. Webhook URL registered in Telegram equals `${APP_URL}/webhooks/telegram/{projectId}`
        with secret_token = random 32-byte hex generated per Connect.
      AC8. POST /api/v1/projects/{projectId}/bot/disconnect:
        (a) calls deleteWebhook in Telegram with 3 retries on 5xx/timeout;
        (b) on persistent Telegram failure, logs WARN ("orphan webhook may remain")
            and PROCEEDS;
        (c) sets bots.status=disconnected, encryptedToken=null, webhookSecret=null,
            disconnectedAt=now in a single atomic Mongo update;
        (d) returns 200 with {status:"disconnected"} on success of (c) regardless
            of (a)/(b) outcome.
        Returns 404 if no `status=connected` bot exists for projectId.
      AC9. GET /api/v1/projects/{projectId}/bot returns the current bot with
        status="connected" (200), or 404 if none. Response shape matches AC1.
      AC10. POST /api/v1/projects/{projectId}/bot/test-message (no body) sends
        "Bot connected ✅" via Telegram sendMessage to the owner's chat_id, looked
        up by `subscribers.{projectId, telegramUserId=currentUser-telegram-link}`.
        In 06 MVP, subscribers collection is empty (06b/Epic 05 populate it) —
        therefore the endpoint returns 422 errors.bot.testMessage.422 = "Send
        /start to your bot in Telegram first, then try again". Endpoint exists
        from day one and starts working transparently once 06b lands. UI shows
        the button always with an inline hint below it.
      AC11. All bot endpoints call ProjectService.requireOwned(currentUserId(),
        projectId, includeSoftDeleted=false) FIRST. Hostile request bodies with
        {ownerId: "<other-user-id>"} ignored — owner derived from
        ReactiveSecurityContextHolder. Foreign/soft-deleted/malformed projectId
        all collapse to 404 (per anti-enumeration pattern in patterns.md).
      AC12. Connect endpoint rate-limited per user: Redis `brute:bot-connect:{userId}`
        INCR + 15-min EXPIRE on first set. 11th attempt within 15min returns 429
        with code `rate_limit_exceeded`. Fail-open if Redis unreachable
        (DoS-mitigation, not auth gate — same shape as auth brute-force).
      AC13. UI never receives or displays the raw token. API responses for any
        bot endpoint never contain the encryptedToken field. Logback test
        configuration includes an appender that asserts no regex match of
        `\d+:[A-Za-z0-9_-]{35}` in rendered log output across all bot tests.
      AC14. UI shows masked token "{first 10 digits}:•••...{last 3 chars}"
        (e.g. "1234567890:•••...xyz"). Read-only display, no "Show full token"
        button.
      AC15. Disconnect button opens a shadcn-vue confirmation modal with text
        "Disconnect bot @{username}? Incoming messages will stop and the webhook
        will be removed. You can reconnect anytime." Cancel/Disconnect buttons.
        Only on Disconnect click is the API called.
      AC16. Frontend `pages/projects/[projectId]/settings.vue` is refactored to a
        folder: `settings/index.vue` (existing general + danger), new `settings/bot.vue`.
        Horizontal sub-nav within Settings links between them ("General" / "Bot").
      AC17. i18n keys:
        - bot.* (page strings — title, button labels, hints, modal text)
        - errors.bot.connect.{400,422,409,502,429} for connect endpoint errors
        - errors.bot.testMessage.{422,502} for test-message endpoint errors
        - errors.bot.disconnect.{404,502} for disconnect endpoint errors (502
          only for hypothetical future hardening — current AC8 spec returns 200
          on Telegram failure)
        Both uk.json and en.json files updated. `prebuild` parity gate passes.
      AC18. Backend module `com.botfunnel.bot` package created from scratch with:
        Bot entity (@Document, @CompoundIndexes), BotRepository, BotService,
        BotController, TelegramApiClient (@Component, WebClient-based with
        connect 5s / read 10s timeouts), TokenEncryptor (@Component, AES-256-GCM
        with random 12-byte IV per encryption, 128-bit auth tag, key from
        `app.bot.encryption.key-v1`, fail-fast constructor on missing/wrong-length key).
      AC19. EventService.logEvent emits on each state change:
        - `bot_connected` { botId, telegramBotId, telegramUsername }
        - `bot_disconnected` { botId, telegramBotId, telegramWebhookCleared:boolean }
        - `bot_test_message_sent` { botId, chatId }
        Metadata NEVER contains the raw or encrypted token.
      AC20. New env vars in `.env.example` and `application.properties`:
        - BOT_TOKEN_ENCRYPTION_KEY_V1 (no default, fail-fast on startup)
        - Mapping: app.bot.encryption.key-v1=${BOT_TOKEN_ENCRYPTION_KEY_V1:}
        APP_URL already present; documented as MUST be HTTPS in prod for webhooks.
      AC21. Race-test: two concurrent Connect requests with the same token (different
        owners or same owner second-tab) — exactly one succeeds (201/200), the
        other returns 409 `bot_already_connected`. Verifiable via WireMock-backed
        integration test using parallel WebTestClient calls.
    gaps: "AC10 contains a forward-dependency note on owner_chat_id source — to
      resolve in decisions: minimal sender vs stub vs deferred until 06b."
    required: true

  edge_cases:
    score: 90
    status: "complete"
    value: |
      Identified gaps from notes:
      - Bot already connected to another project (409 + leakage policy)
      - Invalid token shape (pre-getMe validation?)
      - getMe returns 401 (revoked) vs timeout vs malformed body
      - Bot is valid but webhook is already set (by user via BotFather?) — overwrite or warn?
      - Concurrent connect attempts (race on uniqueness)
      - Reconnect with the SAME bot to the SAME project (re-rotate secret?)
      - Reconnect with a DIFFERENT bot (new doc or update existing?)
      - User refreshes bot identity (changed @username/avatar in BotFather)
    gaps: "Decisions on each edge case TBD."
    required: true

  error_scenarios:
    score: 95
    status: "complete"
    value: |
      Error taxonomy aligned with actual useApiError (resolves by HTTP status only):

      POST /api/v1/projects/{projectId}/bot/connect:
      - 400 — bean-validation. Triggered by @Pattern("^\\d+:[A-Za-z0-9_-]{35}$")
        on token field of ConnectBotRequest. Goes through GlobalErrorHandler's
        WebExchangeBindException branch, no AppException needed. Frontend resolves
        errors.bot.connect.400 = "Bot token has invalid format". Inline form error.
      - 422 token_invalid — AppException.unprocessableEntity("token_invalid", ...).
        Triggered by Telegram getMe 401. errors.bot.connect.422 = "Token is invalid
        or revoked". Inline form error.
      - 409 bot_already_connected — AppException.conflict OR
        DuplicateKeyException → mapped to 409 by GlobalErrorHandler.
        errors.bot.connect.409 = "This bot is already connected to another project".
        Generic, NO foreign project name/owner. Inline form error.
      - 502 telegram_unavailable — AppException via custom factory or
        ResponseStatusException(BAD_GATEWAY). Triggered after 3 retries on
        Telegram 5xx OR timeout (during getMe OR setWebhook).
        errors.bot.connect.502 = "Telegram is currently unavailable. Try again
        in a minute." Toast notification.
      - 429 rate_limit_exceeded — AppException.tooManyRequests. Triggered when
        Redis brute:bot-connect:{userId} ≥ 10 within 15min.
        errors.bot.connect.429 = "Too many attempts. Wait 15 minutes." Toast.

      POST /api/v1/projects/{projectId}/bot/disconnect:
      - 404 — no connected bot to disconnect (project_not_found path via
        requireOwned OR no bots doc with status=connected).
      - Best-effort with Telegram: deleteWebhook 3 retries; on persistent
        failure log WARN + proceed locally. Endpoint ALWAYS returns 200 if
        local update succeeded. No 502 from this endpoint.

      POST /api/v1/projects/{projectId}/bot/test-message:
      - 200 — message sent successfully.
      - 422 chat_id_unknown — owner has not /started the bot yet (chat_id not
        in subscribers). errors.bot.testMessage.422 = "Send /start to your bot
        in Telegram first, then try again". Inline note next to button.
      - 502 telegram_unavailable — same shape as connect endpoint.

      GET /api/v1/projects/{projectId}/bot:
      - 200 — current connected bot.
      - 404 — no connected bot.

      Backend "code" field exists on ErrorResponse (for logs/monitoring) but
      frontend useApiError ignores it. See decisions.md if we ever extend
      useApiError to support code-based resolution.
    gaps: ""
    required: true

  verification_strategy:
    score: 90
    status: "complete"
    value: |
      Manual smoke checklist on staging (post-deploy, ~10 minutes):
      1. Create test bot via @BotFather (/newbot → SmokeTest_XYZ_bot).
      2. Login as smoke_test_owner@..., open /projects/{id}/settings/bot.
      3. Paste token → Connect. Expect: @SmokeTest_XYZ_bot + first_name + masked
         token + Disconnect/Send-Test buttons visible within 5s.
      4. From own Telegram account, write /start to the bot.
      5. Click "Send Test Message" → expect "Bot connected ✅" in Telegram.
      6. In BotFather: /mybots → SmokeTest → Bot Settings → Webhook — URL must
         contain `{APP_URL}/webhooks/telegram/{projectId}`.
      7. Create a second test project (same user), paste the SAME token →
         expect 409 with "already connected to another project" toast/inline.
      8. Return to first project, Disconnect → modal → Confirm → UI returns to
         empty Connect state.
      9. In BotFather check webhook field — must be empty/cleared.
      10. Reconnect same token → expect new document (verify via admin Mongo
          inspection: 2 bots docs for projectId, one disconnected one connected).
      Each step has a checkbox in the staging-smoke template.
