# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
phase1_feature_overview:

  feature_name:
    score: 100
    status: "complete"
    value: "06-bot-connection"
    gaps: ""
    required: true

  feature_description:
    score: 95
    status: "complete"
    value: |
      Page "Settings → Bot" inside a project allows the project owner to connect their
      Telegram bot by pasting the bot token. On Connect: validate token via Telegram
      getMe API; if valid — encrypt token (AES-256-GCM, keyVersion=1) and persist,
      display bot @username + first_name (no avatar in MVP), and auto-register webhook
      at {APP_URL}/webhooks/telegram/{projectId} with a per-project random 32-byte hex
      secret token. Disconnect best-effort calls deleteWebhook in Telegram (3 retries,
      log+proceed on persistent failure), clears the encrypted token and webhook
      secret, marks the bot as disconnected (soft — document preserved for audit,
      reconnect creates a NEW document). Bot uniqueness: same Telegram bot cannot
      be in two `status=connected` documents at once across the platform.
      Token shown in UI masked as "1234567890:•••...xyz".
      Test-message endpoint exists from day one; returns 422 until 06b/Epic 05
      provide subscribers.chatId via /start.
    gaps: ""
    required: true

  work_type:
    score: 100
    status: "complete"
    value: "feature"
    gaps: ""
    required: true

  user_problem:
    score: 90
    status: "complete"
    value: |
      Without a connected bot the project is inert — no subscribers can arrive, no
      messages can be sent, no funnel/broadcast logic has anything to operate on.
      This feature is the gatekeeper for ALL downstream value from the platform
      (Epics 05, 06, 07, 08).
    gaps: "Needs first-person framing from user perspective; confirm the platform-MVP
      framing (10-min onboarding goal from project.md)."
    required: true

  target_users:
    score: 50
    status: "partial"
    value: |
      Project owner (role = User from project.md). The page lives under the
      project-scoped settings, so access is gated by ProjectService.requireOwned.
      Super Admin can VIEW projects but NOT see the raw token (per project.md role
      table). Subscribers are not relevant — they don't see this UI.
    gaps: "Confirm Super Admin behavior on this page (read-only with masked token, or
      no access?). What about multi-owner future (currently 1 owner per project)?"
    required: false

  success_criteria:
    score: 85
    status: "complete"
    value: |
      Draft AC list from workflow/.../06-bot-connection-equivalent (was 04a) notes:
      1. Valid token → @username + bot name shown
      2. Invalid token → localized error with code
      3. Already-connected bot in another project → 409 without leakage of other project
      4. Token persisted encrypted; never plaintext in DB
      5. Webhook auto-registered in Telegram with secret token
      6. Disconnect → deleteWebhook called, secret + token cleared
      7. UI shows masked token; no "Show full token" button
      8. Test message reaches owner chat (requires owner to /start once)
      9. All endpoints go through ProjectService.requireOwned
    gaps: "Finalize AC after Cycle 2 (some depend on edge-case decisions); confirm
      ordering and acceptable phrasing."
    required: true

  constraints:
    score: 90
    status: "complete"
    value: |
      Known constraints:
      - Telegram requires HTTPS for webhooks (production-only; dev needs ngrok/cloudflared)
      - Token at-rest encrypted with BOT_TOKEN_ENCRYPTION_KEY (env var)
      - One bot per project on MVP (project.md, Entity Hierarchy)
      - Bot uniqueness across the platform (uniq Telegram bot id among connected bots)
      - Stack: Spring WebFlux + reactive WebClient for Telegram API; MongoDB; per-project access via requireOwned
      - Production deployment platform TBD; APP_URL must be configurable
      - No raw token ever shown in UI or returned in API responses
    gaps: "Confirm: rate-limit on connect attempts (brute force on token guessing)?
      Token format validation pre-getMe? Webhook URL format / project_id verification on Telegram side?"
    required: true

  testing_strategy:
    score: 90
    status: "complete"
    value: |
      - Unit tests: TokenEncryptor (round-trip + tampered-ciphertext rejection +
        wrong-key rejection).
      - Backend integration: @SpringBootTest + WebTestClient. WireMock (add to
        build.gradle.kts test deps) mocks api.telegram.org. Covers happy-path
        getMe→setWebhook, 401→token_invalid, 5xx with retry exhaustion→
