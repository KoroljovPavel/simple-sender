# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
# Interview Cycle 2 scope (together with Phase 3)
phase2_user_experience:

  user_stories:
    score: 90
    status: "complete"
    value: |
      04c is pure infrastructure — no direct end-user story. Internal caller stories:

      1. As BotService.sendTestMessage (Epic 04a path), when user clicks "Send test message" in Settings → Bot:
         - If Bot.ownerChatId is null → return 422 owner_chat_id_unknown (existing stub preserved).
         - If Bot.ownerChatId != null → call TelegramSender.sendText(botId, ownerChatId, "Hello from Bot Funnel Service! Bot connected ✅", parseMode=null, ownerId=current user).
            - On success → HTTP 200 OK + event bot_test_message_sent + sender already wrote telegram_message_sent.
            - On failure → exception mapped to HTTP error by GlobalErrorHandler. Sender already wrote telegram_send_failed.

      2. As FunnelStepExecutor (Epic 06, future) — calls sendText with no ownerId (or system context). Out of scope for 04c.

      3. As BroadcastWorker (Epic 07, future) — calls sendText with no ownerId. Out of scope for 04c.

      Note: in production 04c happy-path is unobservable until Epic 04b lands (Bot.ownerChatId stays null without webhook ingestion).
    gaps: ""
    required: true

  acceptance_criteria:
    score: 95
    status: "complete"
    value: |
      AC1. TelegramSender bean exists with method:
        sendText(String botId, long chatId, String text, @Nullable String parseMode, @Nullable String ownerId) → Mono<SentMessage>
        where SentMessage is a record (long chatId, long messageId, Instant sentAt).

      AC2. Sender loads bot via BotRepository.findById(botId). If absent → AppException.notFound("Bot not found"). If status != CONNECTED → AppException.notFound (anti-enumeration).

      AC3. Sender decrypts token via TokenEncryptor.decrypt(iv, ciphertext). Base64 boundary at caller (mirror BotService.disconnect:216-218 pattern).

      AC4. Token shape guard (TelegramApiClient.requireValidTokenShape — promoted to public static) runs after decrypt. Any failure (decrypt exception, post-decrypt shape mismatch) → BotTokenInvalidException(botId) → 422 invalid_bot_token.

      AC5. POST to /bot{token}/sendMessage with body { chat_id, text, parse_mode? } (parse_mode included only when non-null).

      AC6. WebClient timeouts: connect 5s, read 10s (reuse TelegramApiClient.CONNECT_TIMEOUT + DEFAULT_RESPONSE_TIMEOUT constants).

      AC7. Retry policy: Retry.backoff(3, Duration.ofSeconds(1)) producing 3 retries AFTER the first attempt = 4 total attempts, sleeps 1s → 2s → 4s. Filter via TelegramApiClient.isTransient (promoted to public static). Transient = 5xx OR IOException OR TimeoutException (incl. Netty ReadTimeoutException via cause-chain walker, 16-hop bound).

      AC8. 429 handling: response body parsed as new record TelegramSendResult<T>(boolean ok, T result, Integer errorCode, String description, TelegramParameters parameters) where TelegramParameters carries retry_after. Wait retry_after seconds + small jitter, retry. NOT counted against the 3-retry cap. Implemented as a separate retryWhen wrapping the 5xx loop (outer-vs-inner ordering verified in tests). Signal exception type: dedicated TelegramRateLimitException (extends AppException, but never escapes — caught by 429-loop retryWhen filter).

      AC9. Overall .timeout(Duration.ofSeconds(30)) on the final Mono. Exceeded → TelegramSendException.

      AC10. Error mapping (no retry):
        - 401 Unauthorized → BotTokenInvalidException(botId) → 422 invalid_bot_token.
        - Other 4xx → TelegramSendException(errorCode, scrubbedDescription) → 400 telegram_send_failed.
        - After retries exhausted on transient class → TelegramSendException.

      AC11. Audit events written by sender (fire-and-forget via EventService.logEvent, userId=ownerId param):
        - telegram_message_sent { botId, chatId, messageId } on success.
        - telegram_send_failed { botId, chatId, errorCode?, errorDescription? (scrubbed), attempts } on terminal failure.

      AC12. Log scrubber (TelegramApiClient.scrubTokens — already public) applied to every WARN/ERROR line that echoes Telegram description / error_message. Token NEVER appears in logback output (verified via ListAppender assertion in tests).

      AC13. Bot.java gains nullable field: Long ownerChatId. Mongo persistence: camelCase field name (Spring Data default). No @CompoundIndex change. No migration script — existing docs read back ownerChatId as null.

      AC14. BotService.sendTestMessage rewritten:
        - bot.ownerChatId == null → return AppException.unprocessableEntity("owner_chat_id_unknown", ...) (current 422 stub preserved verbatim).
        - bot.ownerChatId != null → call telegramSender.sendText(bot.id, bot.ownerChatId, TEST_MESSAGE_TEXT, null, ownerId).then(eventService.logEvent(ownerId, "bot_test_message_sent", ip, ua, metadata)).then().
        - On TelegramSender error: exception propagates to GlobalErrorHandler; BotService writes NO additional bot_test_message_failed event (sender already wrote telegram_send_failed).

      AC15. Three new exception classes extend AppException:
        - TelegramSendException(HttpStatus.BAD_REQUEST, "telegram_send_failed", ...).
        - TelegramRateLimitException(int retryAfterSeconds) — dedicated class, internal-only (caught inside the 429 retryWhen filter, never escapes to GlobalErrorHandler). Carries retryAfter for jitter computation.
        - BotTokenInvalidException(HttpStatus.UNPROCESSABLE_ENTITY, "invalid_bot_token", ...) — carries botId for log context.

      AC16. SecurityConfig: NO change required (POST /api/v1/projects/{projectId}/bot/test-message already covered by /api/** authenticated rule per SecurityConfig.java:68-73).

      AC17. Tests:
        - Unit (TelegramSenderTest, MockWebServer + no Spring context): success, retry-then-success on 5xx, retry-exhausted → TelegramSendException, 429 retry_after honored, 401 → BotTokenInvalidException, other 4xx → TelegramSendException, token shape guard rejects malformed before HTTP, log scrubber on description.
        - Integration (TelegramSenderIT, full Spring context with embedded Mongo, MockWebServer for Telegram): end-to-end through BotRepository + TokenEncryptor + EventService, including awaitility assertion on async event write.
        - BotServiceTest update: split existing test BotServiceTest.java:554-573 into ownerChatId-null branch (422 preserved) + ownerChatId-set branch (sender invoked, no 422).
        - BotControllerIT update: existing 422 test at BotControllerIT.java:740-760 stays as null-branch case; add positive-path test that seeds ownerChatId in Mongo and asserts 200 + event.
        - "Token never in logs" test using ListAppender (mirror TelegramApiClientTest.java:43-47 pattern).
        - NO new staging smoke runbook (deferred to Epic 04b).
        - NO E2E (no live Telegram, no new UI flow).
    gaps: ""
    required: true

  edge_cases:
    score: 90
    status: "complete"
    value: |
      1. Bot doc not found (botId mismatch / deleted) → 404 (anti-enumeration).
      2. Bot status DISCONNECTED (token nulled out, ownerChatId may or may not exist) → treated as not found (404) — sender refuses to operate on disconnected bots.
      3. Bot doc has CONNECTED status but encryptedToken fields are null (impossible per invariants, but defensive) → BotTokenInvalidException.
      4. TokenEncryptor.decrypt throws (corrupted ciphertext, wrong key, BadPaddingException) → BotTokenInvalidException.
      5. Decrypted token fails requireValidTokenShape → BotTokenInvalidException.
      6. Telegram returns 401 (token revoked externally between Connect and now) → BotTokenInvalidException.
      7. Telegram returns 429 with retry_after: honor, retry, success — counts as one logical send (one telegram_message_sent event, attempts metadata reflects total attempts incl. 429 retries).
      8. Telegram returns 429 → wait → 429 → wait → eventually hits 30s overall timeout → TelegramSendException.
      9. Telegram returns 5xx 4 times in a row → TelegramSendException after exhaustion.
      10. Network failure mid-flight (TimeoutException, ReadTimeoutException, IOException) → retry as transient.
      11. Telegram returns 200 OK with ok=false in body (rare, but possible) → treat as failure, map to TelegramSendException (description preserved, scrubbed).
      12. Telegram returns 400 for text > 4096 chars → TelegramSendException (NO pre-validation).
      13. Telegram returns 400 chat_not_found → TelegramSendException (no Subscriber-specific mapping in 04c).
      14. Concurrent sendText calls for the same botId → no state contention; each loads + decrypts independently.
      15. Race: sender loads bot, owner disconnects mid-flight → in-memory token still works for the in-flight call; next call will see DISCONNECTED. Acceptable.
      16. ownerId == null at sender level (Epic 06/07 system context, future) → telegram_message_sent.userId stored as null; EventService accepts null (precedent: AuthService.java:301).
      17. Mongo unavailable during EventService.logEvent → event lost (fire-and-forget); sender's main Mono unaffected (matches existing bot_connected/bot_disconnected behavior).
    gaps: ""
    required: true

  error_scenarios:
    score: 95
    status: "complete"
    value: |
      Exception → HTTP mapping (via GlobalErrorHandler since all extend AppException):

      | Sender outcome | Exception | HTTP status | Code |
      |---|---|---|---|
      | Telegram 200 ok=true | — | 200 OK | — |
      | Telegram 200 ok=false | TelegramSendException | 400 | telegram_send_failed |
      | Telegram 401 | BotTokenInvalidException | 422 | invalid_bot_token |
      | Telegram 4xx other | TelegramSendException | 400 | telegram_send_failed |
      | Telegram 5xx after retries | TelegramSendException | 400 | telegram_send_failed |
      | Telegram 429 (during loop) | TelegramRateLimitException (internal) | — handled internally | — |
      | 30s overall timeout | TelegramSendException | 400 | telegram_send_failed |
      | Network / IOException after retries | TelegramSendException | 400 | telegram_send_failed |
      | Bot not found / DISCONNECTED | AppException.notFound | 404 | (no body code) |
      | Decrypt failure / shape mismatch | BotTokenInvalidException | 422 | invalid_bot_token |
      | Programming bug (null arg, etc.) | IllegalArgumentException | 500 | (GlobalErrorHandler fallback) |

      All description fields scrubbed via TelegramApiClient.scrubTokens before logging or surfacing.
    gaps: ""
    required: true

  verification_strategy:
    score: 90
    status: "complete"
    value: |
      Pre-deploy (during development):
        - Run `./gradlew test` — full unit + integration suite. MockWebServer scripts all Telegram scenarios.
        - Inspect logs for "token never in logs" assertion (ListAppender test).
        - Manual: `./gradlew bootRun` + curl POST /api/v1/projects/{id}/bot/test-message — still expects 422 owner_chat_id_unknown because production Bot.ownerChatId is null.
        - Manual smoke for end-to-end happy path: in dev, manually mongosh `db.bots.updateOne({_id: ObjectId(...)}, {$set: {ownerChatId: <my_telegram_user_id>}})` to simulate what 04b will do, then test-message → real Telegram delivery. Document command in tech-spec but NOT a permanent runbook.

      Post-deploy (production):
        - 04c does NOT change observable behavior in production (sendTestMessage still 422 until 04b populates ownerChatId).
        - Verify deploy via: GET /health → 200 (existing); deployment metrics (CI green); no new endpoints to verify.

      Staging:
        - No new staging smoke runbook in 04c. Existing 06-bot-connection runbook stays untouched. Full sendText smoke moves to Epic 04b runbook (where ownerChatId becomes available via webhook).

      Test coverage targets (mirror auth/profile/project conventions):
