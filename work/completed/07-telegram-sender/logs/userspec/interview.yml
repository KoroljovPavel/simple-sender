    value: "None for 04c. Existing Settings → Bot 'Send test message' button (Epic 04a) is unchanged. Frontend has NO new strings, NO new components. Pure backend feature."
    gaps: ""
    required: false

  risks:
    score: 90
    status: "complete"
    value: |
      R1. Sender exercising in production is impossible until 04b lands (Bot.ownerChatId stays null). Mitigation: cover via integration tests with seeded Mongo + flag the dependency in tech-spec verification section.

      R2. Promoting requireValidTokenShape + isTransient from private to public on TelegramApiClient changes its public surface area. Mitigation: keep same signature; comment why promoted; recompile-check.

      R3. Reactor retry-loop ordering: 429 outer / 5xx inner. Wrong order causes 5xx retry-cap to exhaust during retry_after wait. Mitigation: explicit unit tests for interleaving (429 immediately followed by 5xx and vice versa).

      R4. Long 429 loops + 30s overall timeout: user sees timeout from frontend BEFORE sender's own 30s fires, because frontend default ofetch timeout is ~35s but full network round-trip + cancellation latency could vary. Mitigation: explicit `.timeout(30s)` on sender Mono; ensure frontend handles 504/timeout gracefully (already in scope of existing useApiError patterns).

      R5. EventService.logEvent is fire-and-forget — terminal-failure event (telegram_send_failed) may not flush before process death. Mitigation: acceptable for MVP (matches bot_connected/bot_disconnected); document in tech-spec, do not gate.

      R6. Bot.ownerChatId addition lands in DB schema without explicit migration. Mitigation: Spring Data MongoDB reads missing fields as null for object types (Long, not primitive long); precedent verified in research §5.5 (disconnectedAt added the same way).

      R7. Token corruption (tampered Mongo storage, key rotation gone wrong) → BotTokenInvalidException → 422 looks like "user-fixable" but root cause is operations. Mitigation: WARN-level log with scrubbed context + ops alert (manual review).

      R8. TelegramSender called from non-user contexts (Epic 06/07 future) — ownerId=null in audit events reduces observability. Out of scope for 04c; flag in tech-spec as "Epic 06/07 may want to introduce a system-context sentinel".
    gaps: ""
    required: true

  technical_decisions:
    score: 80
    status: "complete"
    value: |
      D1. Single method sendText only — other 4 methods (sendWithButtons/sendImage/editMessage/deleteMessage) deferred until concrete caller exists. YAGNI.
      D2. No token decrypt cache — premature; revisit when Epic 07 broadcast load demonstrates need.
      D3. Audit events written by sender, not caller — guaranteed audit trail regardless of caller.
      D4. ownerId as optional param to sender — caller passes its context; null acceptable for system context.
      D5. Exceptions extend AppException — leverages existing GlobalErrorHandler; consistent with bot/ module precedent.
      D6. Default parse_mode=null (not HTML) — safer default; HTML injection risk for future user-content callers.
      D7. Sender refuses to operate on DISCONNECTED bots (404, anti-enumeration) — no implicit re-validation.
      D8. Pre-validation absent for text length — Telegram is the source of truth; sender stays thin.
      D9. Overall 30s timeout on sender Mono — bounded worst-case; aligns with frontend timeout.
      D10. requireValidTokenShape + isTransient promoted to public static on TelegramApiClient — mirrors prior scrubTokens promotion; DRY.
    gaps: ""
    required: false

  deploy_approach:
    score: 75
    status: "complete"
    value: |
      Backend-only change. Standard GitHub Actions CI/CD when platform is chosen (deployment.md: TBD). Locally — `./gradlew bootRun`. No new env vars. No new infrastructure dependencies. No Mongo migration (nullable field added, existing docs read back as null). No SecurityConfig change.

      Rollout: standard PR merge → main → CI build/test → deploy. Existing 06-bot-connection users unaffected (sendTestMessage continues returning 422 until 04b populates ownerChatId).
    gaps: ""
