# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
# Interview Cycle 2 scope (together with Phase 3)
phase2_user_experience:

  user_stories:
    score: 90
    status: "complete"
    value: |
      Story 1 (Telegram → Service): Subscriber пише `/start` боту. Telegram POST-ить update на /webhooks/telegram/{projectId}. Service за <100ms відповідає 200 OK, raw update збережений, JobRunr-job у черзі.
      Story 2 (Worker → Stubs): JobRunr забирає job, парсить `/start [ref_123]`, викликає `SubscriberService.upsertFromTelegramUpdate` (no-op у 04b), `FunnelTriggerService.fire("on_start", "ref_123")` (no-op), пише event telegram_command_start з metadata.startPayload="ref_123".
      Story 3 (Owner self-attach): Project owner після Connect-bot пише `/start` зі свого Telegram. Worker детектує (private-chat /start + ownerChatId IS NULL + CONNECTED) → атомарно populate Bot.ownerChatId. У UI на Settings → Bot тепер "Send test message" реально щось пише в Telegram.
      Story 4 (Idempotency): Telegram повторно надсилає той самий update_id (бо наш 200 затримався). Service за <100ms знов відповідає 200 OK, але raw_updates лишається з одним документом, новий job НЕ ставиться, event НЕ дублюється.
      Story 5 (Unsubscribe): Subscriber пише `/stop`. Worker викликає no-op stubs (markUnsubscribed + cancelActiveFor), пише event telegram_command_stop.
    gaps: ""
    required: true

  acceptance_criteria:
    score: 95
    status: "complete"
    value: |
      AC1. POST /webhooks/telegram/{projectId} з валідним SHA-256-hashed secret token → 200 OK за <100ms P99 (load-test проти Testcontainer Mongo, 100 sequential POSTs).
      AC2. Bad/missing X-Telegram-Bot-Api-Secret-Token → 401, БЕЗ тіла (ResponseEntity.status(401).build()).
      AC3. Неіснуючий / soft-deleted / без CONNECTED-бота projectId → 404 (uniform anti-enumeration, без тіла або з generic shape).
      AC4. Payload > 1 MB → 413 Payload Too Large.
      AC5. Той самий (projectId, update_id) двічі (parallel або послідовно) → один документ у raw_updates, один JobRunr job, один event. Race-test: 2 паралельні POST → status pair {200, 200}, exactly 1 row, exactly 1 enqueued job.
      AC6. /start від власника у private-chat коли Bot.ownerChatId IS NULL → ownerChatId записаний атомарно (findAndModify); другий /start від іншого користувача → ownerChatId НЕ перезаписується.
      AC7. /start ref_X у private-chat → events.metadata.startPayload="ref_X"; виклик SubscriberService.upsertFromTelegramUpdate + FunnelTriggerService.fire("on_start", "ref_X") (заглушки).
      AC8. /stop у private-chat → виклик заглушок markUnsubscribed + cancelActiveFor; event telegram_command_stop.
      AC9. Будь-який /start у group/supergroup/channel (chat.type != "private") → event записаний, АЛЕ ownerChatId НЕ populate-иться, Subscriber stub НЕ викликається.
      AC10. Звичайний текст у private-chat → SubscriberService.upsertFromTelegramUpdate stub + event telegram_message_received. У не-private — лише event, без upsert.
      AC11. Non-message update (callback_query, edited_message тощо) → silent ignore: raw_update збережений, event telegram_update_other, без виклику stubs.
      AC12. Невідома команда (/foo bar) → event telegram_message_received тільки, без stubs.
      AC13. raw_updates.createdAt має TTL index 90 днів (MongoDB native, не cleanup-job).
      AC14. Worker exception → raw_updates.processingStatus="failed" + raw_updates.processingError записаний; JobRunr Failed queue ловить через built-in retry; після N retries — лог + admin може redrive вручну через JobRunr dashboard (deferred enable у Epic 09/10).
      AC15. SecurityConfig: pathMatchers("/webhooks/telegram/**").permitAll() ПЕРЕД /api/**.authenticated(); CSRF disabled через requireCsrfProtectionMatcher exclusion (НЕ глобальний disable). Тест: /api/** все ще вимагає авторизацію.
      AC16. 3 micrometer counters написані: telegram_webhook_received_total{projectId}, telegram_webhook_duration_seconds, telegram_webhook_rejected_total{reason=invalid_secret|project_not_found|duplicate|payload_too_large}.
      AC17. Bot.ownerChatId не індексований; додавання поля БЕЗ Mongo migration (nullable wrapper, legacy docs читаються як null).
      AC18. Token-scrubber застосовується до всіх лог-сайтів у webhook handler + worker (повторне використання TelegramApiClient.scrubTokens).
    gaps: ""
    required: true

  edge_cases:
    score: 90
    status: "complete"
    value: |
      1. Telegram retry duplicate update_id → idempotency (AC5).
      2. Non-message updates (callback_query, edited_message, my_chat_member, etc.) → silent ignore (AC11).
      3. /start у group → подія записана, але ownerChatId не populate (AC9).
      4. /start@botname (Telegram suffixes в груп-чатах) → парсер strip-ає @botname.
      5. /start без payload → payload="" в events.metadata (не null).
      6. /start з multi-word payload (/start ref_a b c) → payload — все після першого whitespace, trimmed.
      7. message.from відсутнє (рідко, для channel posts) → safe-навігація (Optional / null-check), event telegram_update_other.
      8. message.chat.type не "private" — group/supergroup/channel — обмежений процессінг (AC9, AC10).
      9. Two concurrent /start від двох різних users у private-chat, ownerChatId IS NULL → findAndModify атомарно вибере одного. Threat model: швидкий атакер може race-нути; accepted.
      10. Bot DISCONNECTED після того, як webhook вже зареєстрований у Telegram (delete order: Telegram deleteWebhook → Mongo erase secret). Якщо update прийшов після erase secret → bot не CONNECTED → 404.
      11. Malformed projectId (не ObjectId hex) → onErrorMap IllegalArgumentException → 404 (uniform anti-enumeration).
      12. JobRunr storage Mongo вниз при enqueue → 500 (рідкісно; fall back на JobRunr's own retry).
      13. Worker exception при mid-flight (наприклад, NPE в parsing) → processingStatus=failed; JobRunr retry; після exhaustion — DLQ-like видимість через jobrunr dashboard + raw_updates row.
    gaps: ""
    required: true

  error_scenarios:
    score: 90
    status: "complete"
    value: |
      ER1. Invalid/missing secret token → 401 no body (AC2). Counter rejected{reason=invalid_secret} +1.
      ER2. Project not found / soft-deleted / bot disconnected → 404 (AC3). Counter rejected{reason=project_not_found} +1.
      ER3. Payload > 1 MB → 413 (AC4). Counter rejected{reason=payload_too_large} +1.
      ER4. Duplicate (projectId, update_id) → 200 OK silent (AC5). Counter rejected{reason=duplicate} +1, але saved=false (важливо щоб юзер-метрика отримання Telegram-у не падала).
      ER5. Mongo вниз при raw_updates insert → 500 (Telegram повторно надішле через свій retry). НЕ ловимо це як rejected, а як internal error.
      ER6. JobRunr storage Mongo вниз при enqueue → 500 (rare; same retry mechanism).
      ER7. Worker exception → processingStatus=failed + processingError; JobRunr retry exhausted → manual redrive операторами (admin tools deferred).
      ER8. Token leak risk у логах → token-scrubber wrap (AC18).
    gaps: ""
    required: true

  verification_strategy:
    score: 90
    status: "complete"
    value: |
      During development (no deploy needed):
      - Unit tests: TelegramCommandParserTest, WebhookSecretVerifierTest (constant-time).
      - Integration tests (@SpringBootTest + Testcontainers Mongo): TelegramWebhookControllerIT з усіма AC1-AC18 covered. Race-test через Flux.range(0,2).parallel(2). Token-leak invariant tests з ListAppender. ownerChatId atomic-write test з паралельним викликом.
      - ProcessTelegramUpdateJobTest: invoke worker directly (як HardDeleteJobTest).
      - WebhookSecurityBlockTest: slice-style — webhook permitAll, /api/** все ще auth-required.
      - SecurityConfig rule-order test (existing pattern в SecurityBlockTest).

      After deploy to staging:
      - docs/staging-smoke/08-webhook-ingestion.md (нова: 10-15 хв checklist):
        1. Створити test bot через BotFather (`SmokeTest_XYZ_bot`)
        2. У staging UI: Settings → Bot → Connect (04a flow)
        3. Перевірити Telegram getWebhookInfo → url=https://staging-host/webhooks/telegram/{projectId}
        4. Зі свого Telegram написати боту /start ref_smoke_001
        5. mongosh: db.raw_updates.find({projectId}) → один документ
        6. mongosh: db.events.find({eventType:"telegram_command_start"}) → один event, metadata.startPayload="ref_smoke_001"
        7. mongosh: db.bots.findOne({projectId}).ownerChatId → not null
        8. У UI клікнути "Send test message" → отримати повідомлення в Telegram (закриває 04c gap!)
        9. Написати /stop → event telegram_command_stop у Mongo
        10. Disconnect bot, видалити test bot через BotFather

      MCP-based verification (post-deploy QA): використовувати Playwright MCP для UI flow + Telegram MCP для send/check messages (можлива опція — за rules user can specify).
    gaps: ""
    required: true

  ui_ux_requirements:
    score: 100
    status: "complete"
    value: "N/A — інфраструктурний шар, без UI-зміни. Side-effect: 'Send test message' button (04c) починає працювати у production happy path."
    gaps: ""
    required: false

  risks:
    score: 90
    status: "complete"
    value: |
      R1. <100ms P99 SLA з greenfield JobRunr-enqueue-from-WebFlux. Mitigation: load-test (100 sequential POSTs) в AC; Mono.fromCallable(...).subscribeOn(boundedElastic()) для enqueue. Якщо load-test показує >100ms, додаємо Caffeine cache для Bot lookup (deferred per patterns.md).
      R2. ownerChatId race: швидкий атакер може claim'нути ownerChatId перед оператором. Mitigation: accepted threat per Q10; staging-smoke runbook instructs "/start first thing"; UI mitigations deferred.
      R3. CSRF matcher syntax у Spring Security 6.5.x може мати тонкощі (negated matcher API). Mitigation: cross-check у tech-spec через Context7 + integration test "POST /api/v1/... без X-XSRF-TOKEN → 403".
      R4. Token leak в логах. Mitigation: AC18 + ListAppender tests на кожен лог-сайт окремо.
      R5. JobRunr Failed queue UX: dashboard поки disabled (application.properties:34). Якщо payload зламається на production, видимість тільки через Mongo query. Mitigation: явно прописати в runbook + Epic 10 (admin panel) увімкне dashboard.
      R6. Duplicate-detection через DuplicateKeyException — reactive save повинен propagate; підтверджено precedent BotService.connect. Mitigation: integration test покриває.
      R7. Bot.deletedAt cascade — якщо проект soft-deleted, але bot row не зачеплений, ми все ж дамо 404 (CONNECTED-only lookup). Якщо bot row залишився CONNECTED після project soft-delete (bug) — тоді ми приймемо update. Mitigation: tech-spec має перевірити ProjectHardDeleteJob cascade behavior; додати integration test "soft-delete project → next webhook → 404".
      R8. Micrometer dep adoption: перший раз додаємо micrometer-core у проект — потенційний side-effect на startup performance / metrics namespacing. Mitigation: за Q9 додаємо тільки micrometer-core (не actuator), без endpoints. Tech-spec ratify.
    gaps: ""
    required: true

  technical_decisions:
    score: 85
    status: "complete"
    value: |
      TD1. Webhook responds <100ms P99 SLA. (Q3, AC1)
      TD2. Idempotency via unique compound index (projectId, updateId) + DuplicateKeyException catch + silent 200. (notes.md, Q1, AC5)
      TD3. Anti-enumeration uniform 404 — single botRepository.findByProjectIdAndStatus(projectId, CONNECTED) lookup collapses missing-project / soft-deleted / disconnected / malformed. (code-research §1, AC3)
      TD4. SHA-256 hash of secret stored, verifier re-hashes + constant-time compare (MessageDigest.isEqual). Promote sha256Hex helper до common/crypto/ якщо tech-spec. (patterns.md, AC18 indirect)
      TD5. Payload 1 MB cap через ServerCodecConfigurer global override (просте) АБО WebFilter тільки для webhook path (selective). Tech-spec decides. (Q5, AC4)
      TD6. JobRunr concurrency default; БЕЗ per-chat ordering. Known compromise, deferred 05/06. (Q6)
      TD7. DLQ: JobRunr Failed queue + raw_updates.processingStatus + processingError. Без окремої колекції. (Q7, AC14)
      TD8. Micrometer-core dep (option A) — 3 counters; без actuator endpoints. (Q9, AC16)
