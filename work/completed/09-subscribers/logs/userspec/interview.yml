      TD2. SubscriberEvent — нова колекція (Q3, code-research §9). TTL 365d на createdAt, index (subscriberId, createdAt desc).
      TD3. Search via Mongo text index on (firstName, lastName, username), min 2 chars (Q4). Case-insensitive default. Deferred Atlas Search если >1M.
      TD4. Cursor pagination з base64-encoded (lastCreatedAt, lastId) tuple (Q4). 50/page UI, 200 hard cap API.
      TD5. Tags — окрема колекція з unique(projectId, slug) (Q5). On-demand counter aggregation, Redis 60s cache якщо >300ms профайл.
      TD6. Tag rename — sync update_many до threshold 10k subscribers, async TagRenameJob інакше (Q5, R2). Threshold env-tunable.
      TD7. Status state-machine writers (Q6, code-research §4): active↔unsubscribed via webhook worker або UI; *→blocked/deleted via TelegramSender direct call SubscriberService.markBlocked/markDeleted. Reactivation on /start.
      TD8. CSV export storage — MongoDB GridFS (Q7-pivot, code-research §6). No env var for path; unified backups; signed-URL endpoint streams GridFsResource.
      TD9. Signed-URL — HMAC-SHA256(exportId, expiresAt) keyed by env SUBSCRIBER_EXPORT_TOKEN_KEY; expiry 7d (Q7, R9). Helper SignedDownloadToken у common/crypto/.
      TD10. Email — EmailService.sendExportReadyEmail + sendExportFailedEmail; raw HTML templates у resources/templates/email/ (code-research §8).
      TD11. Rate-limit C — 100 нових /start per project per minute via Redis bucket bf:rate:start:{projectId}; existing-subscriber re-/start exempt; fail-open (Q8, code-research §7).
      TD12. Project soft-delete cascade — keep children intact; ProjectHardDeleteJob extends cascade to subscribers + subscriber_events + tags + subscriber_exports + GridFS (Q10).
      TD13. Subscriber status=deleted forever (Q11). No purge job in Epic 05.
      TD14. CSV export concurrency — one in-flight per project via partial-unique index (projectId, status IN PENDING|RUNNING); 409 export_in_flight на duplicate (Q12). Metadata doc forever, GridFS file 7d, status→PURGED після cleanup.
      TD15. CustomFieldDefinition — name slug immutable, label/defaultValue editable, type immutable (Q13). Delete cascades $unset on subscribers + confirm modal.
      TD16. TelegramSender hook — direct constructor inject SubscriberService (Q14). markBlocked/markDeleted called inside sendText catch; toThrowable pure mapper. Events split: telegram_send_failed (sender), subscriber_blocked/_deleted (service).
      TD17. Stub replacement — delete NoOpSubscriberService (R11). Add SubscriberServiceImpl @Service. Tests update to use real impl (no slice tests rely on no-op currently per code-research §1).
      TD18. Package layout — com.botfunnel.subscriber/ (entity, service, controller, repository, dto, jobs, export); com.botfunnel.tag/ окрема; CustomFieldDefinition у project/ (embedded record) + CustomFieldsController у project/ (code-research §12).
      TD19. DTO style — Java records, suffix Request/Response, @JsonIgnoreProperties(ignoreUnknown=true) (code-research §12).
      TD20. Error codes — 422 (business rule), 400 (bean validation), 409 (unique conflict). Specific codes: tag_name_taken, custom_field_*, export_in_flight, export_filter_too_large, export_expired, export_purged, export_project_unavailable, rate_limit_exceeded (event-only, not HTTP), already_unsubscribed.
      TD21. JobRunr — recurring ExportCleanupJob @Recurring(id="subscriber-export-cleanup", cron="0 3 * * *"); one-shot ExportSubscribersJob enqueue via JobScheduler з deterministic UUID = nameUUIDFromBytes(exportId) (code-research §5).
