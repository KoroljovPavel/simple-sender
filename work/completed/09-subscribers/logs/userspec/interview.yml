# ============================================================================
# Conversation History
# ============================================================================
conversation_history:
  - question_num: 1
    timestamp: "2026-05-24 00:00:00"
    topic: "initial_clarifications: workflow→Mongo mapping, custom-fields placement, tag counter, history collection, scope, csv export"
    agent_question: |
      Opening probe (6 точок) перед стартом інтерв'ю — звірка workflow/05-підписники з architecture.md:
      1. JSONB у workflow читається як MongoDB embedded document — ок?
      2. CustomFieldDefinition: окрема колекція чи embed у Project doc?
      3. Tags counter: real-time inc/dec на add_tag/remove_tag чи on-demand aggregation?
      4. Subscriber profile "останні 50 подій" — нова колекція subscriber_events чи розширення events?
      5. "Send personal message" з профілю — включаємо чи в 12-nice-to-have?
      6. CSV export 100K+ підписників: синхронний download чи async job (email/in-app link)?
    user_answer: |
      1. так, якщо це взагалі буде необхідно
      2. як краще нова сутність чи прямо в проект?
      3. давай по запиту, але якщо в реальному часі простіше швидше то можна і в реальному часі
      4. як ти вважаєш що краще?
      5. лишаємо
      6. давай 2. Job з відправкою на імейл або посилання прям в проекті після генерації
    summary: |
      P1 — embedded approach OK (subdoc/array на Subscriber).
      P2 — user asks for recommendation: agent will propose embed-in-Project (max 20 полів, bounded).
      P3 — on-demand aggregation OK, real-time allowed if simpler.
      P4 — user asks for recommendation: agent will propose new subscriber_events collection (different retention/access pattern).
      P5 — Send personal message INCLUDED in 09 scope.
      P6 — async CSV export job; result delivered via email link AND in-app download link.
  - question_num: 2
    timestamp: "2026-05-24 00:01:00"
    topic: "design-recos: customfields placement, subscriber_events collection, search/pagination, tags lifecycle"
    agent_question: |
      Batch 2 (4 закриваючі рекомендації):
      Q2. CustomFieldDefinition — recommend embed у Project.customFieldDefinitions[] (bounded 20, atomic update, never queried independently).
      Q3. SubscriberEvent — recommend нова колекція subscriber_events (TTL 1y, index (subscriberId, createdAt desc)), окремо від events (різна retention + access pattern).
      Q4. Search/Pagination — Mongo text index (firstName, lastName, username) + min 2 chars, cursor-pagination (lastCreatedAt, lastId base64), 50 per UI / 200 max API. Indexes: unique(projectId, telegramUserId), (projectId, status, createdAt desc), (projectId, tags), text-index.
      Q5. Tags — окрема колекція tags{projectId, slug, label?, createdAt} unique(projectId, slug), counters on-demand (aggregation, Redis 60s cache if slow), implicit find-or-create on add_tag, explicit CRUD via /tags, rename = sync update_many, delete = $pull + confirm modal.
    user_answer: "Q2 Ok, Q3 згоден, Q4 ok, Q5 ok"
    summary: "All 4 design recos accepted. Lock-in: customFields embedded in Project, subscriber_events new collection, text-index + cursor pagination, separate tags collection with on-demand counters."
  - question_num: 3
    timestamp: "2026-05-24 00:02:00"
    topic: "status-machine, csv export storage, per-project cap, testing strategy"
    agent_question: |
      Batch 3 (4 closing questions for Cycle 1):
      Q6. Status state-machine: active↔unsubscribed (/stop or manual), *→blocked (TelegramSender 403), *→deleted (TelegramSender 400 chat-not-found); reactivation на нове /start для unsubscribed/blocked/deleted. TelegramSender — єдиний writer статусів 403/400 у broadcast/funnel/personal-msg паттернах.
      Q7. CSV export storage: локальний disk + EXPORT_STORAGE_DIR + 7-day TTL + signed URL + email + in-app exports list + 10 min job timeout.
      Q8. Per-project cap: A — no cap, B — hard 100k subscribers, C — rate-limit 100 /start/min via Redis bucket. Recommend C.
      Q9. Testing matrix: unit (StatusMachine, SegmentFilterBuilder, CsvBuilder, CustomFieldValidator, TgTextValidator), integration (replace NoOp + tags + custom-fields + list + export + status flips + access guards + cross-project isolation), E2E (Playwright golden path), staging-smoke (docs/staging-smoke/09-subscribers.md).
    user_answer: |
      Q6 ok, Q7 давай в базу байти покладемо, gridfs, Q8 C, Q9 ok
    summary: |
      Q6 — status state-machine confirmed including reactivation rules.
      Q7 — PIVOT: CSV files stored in MongoDB GridFS (NOT local disk). Unified backups, multi-instance compat, no env var for path. ExportCleanupJob deletes via GridFsTemplate. Signed-URL download endpoint streams from GridFS.
      Q8 — C selected: Redis-based rate-limit 100 new-/start/min per project. Existing subscriber re-/start exempt. No hard cap on total count.
      Q9 — Testing matrix accepted.
  - question_num: 4
    timestamp: "2026-05-24 00:03:00"
    topic: "post-code-research: cascade, deleted retention, export concurrency, customfield semantics, sender hook"
    agent_question: |
      Batch 4 (5 closing questions from code-research open list):
      Q10. Project soft-delete cascade: A — soft only project doc, children intact, hard-delete cascades all (extend ProjectHardDeleteJob: subscribers + subscriber_events + tags + subscriber_exports + GridFS); restore returns everything; signed URL for soft-deleted → 410. B — soft-delete project clears children immediately.
      Q11. Subscriber status=deleted retention: A — forever (reactivate on new /start), no purge job. B — TTL 6 months.
      Q12. CSV export concurrency: A — one in-flight per project (409 on second), state via partial-unique index on subscriber_exports (projectId, status IN PENDING|RUNNING). Metadata doc forever; GridFS file 7d; after purge status=PURGED, download → 410. B — unbounded queue. C — cap N=3.
      Q13. CustomFieldDefinition semantics: A — rename slug (mongo $rename on all subscribers). B — slug immutable, label/defaultValue editable; type immutable; delete with cascade $unset + confirm "X subscribers will lose data".
      Q14. TelegramSender error-hook: A — direct constructor-inject SubscriberService in sender, call markBlocked/markDeleted in sendText catch, toThrowable stays pure mapper. B — ApplicationEventPublisher (no precedent). C — typed-exception bubble. Plus: telegram_send_failed audited by sender; subscriber_blocked/_deleted events written by SubscriberService.
    user_answer: "q10 a, q11 a, q12 a, q13 b, q14 згоден"
    summary: |
      All 5 recommendations accepted:
      Q10 A — ProjectHardDeleteJob extends cascade list to include subscriber CRM collections + GridFS files. Soft-delete window keeps children intact. Restore re-enables.
      Q11 A — deleted-status forever, reactivate on new /start; no TTL/purge job in Epic 05.
      Q12 A — one in-flight export per project; subscriber_exports doc forever + GridFS file 7d; download 410 after purge.
      Q13 B — CustomFieldDefinition.name immutable, label/defaultValue editable, type immutable; delete cascades $unset on all subscribers with confirm.
      Q14 A — direct SubscriberService injection in TelegramSender; events split: telegram_send_failed by sender, subscriber_blocked/_deleted by service.
  - question_num: 5
    timestamp: "2026-05-24 00:04:00"
    topic: "completeness-checker gap closures: pagination, tag slug regex, HMAC payload, retry UX, markBlocked signature, sidebar+index strategy"
    agent_question: |
      Batch 5 (close completeness-checker gaps):
      Q15. Pagination on /subscribers — recommend cursor only via "Load more" infinite (no numbered pages, no Prev).
      Q16. Tag slug regex — recommend `^[a-z0-9_-]{1,32}$` lowercase+alnum+dash/underscore, no dots.
      Q17. Signed URL HMAC payload — A: HMAC_SHA256(SECRET, exportId|expiresAt|projectId), so cross-project substitution blocked at HMAC verify. B: keep current (DB-lookup only).
      Q18. Failed export "Retry" button — replace with "New export" (creates new POST with same filter; old FAILED row stays for audit, manually deletable). Or remove button entirely.
      Q19. SubscriberService.markBlocked/markDeleted signature — A: (projectId, botId, chatId) + sender re-fetches bot; B: (Bot, chatId) pass entity; C: (projectId, botId, chatId) with sender extracting from already-loaded Bot.
      Q20. Sidebar nav for Tags/Custom Fields — sub-items under Subscribers or under Project Settings? Production index management — @PostConstruct ensureIndex callbacks vs auto-index-creation в prod (currently true).
    user_answer: "Q15 ok, q16 ok, q17 a, q18 ok, q19 c, q20 нема думки"
    summary: |
      Q15 ok — cursor "Load more" only.
      Q16 ok — `^[a-z0-9_-]{1,32}$` lowercase regex, no dots.
      Q17 A — HMAC payload includes projectId (defense-in-depth at verify level, no DB hit).
      Q18 ok — "New export" replaces "Retry" for FAILED/PURGED rows; failed rows stay for audit.
      Q19 C — loose coupling: markBlocked/markDeleted takes (projectId, telegramBotId, chatId); sender extracts projectId from already-loaded Bot (no re-fetch).
      Q20 agent decides: sub-items under Subscribers + keep auto-index-creation=true (already globally enabled per application.properties:9; new collections inherit, accepted risk documented in tech-spec).

# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
phase1_feature_overview:

  feature_name:
    score: 100
    status: "complete"
    value: "09-subscribers"
    gaps: ""
    required: true

  feature_description:
    score: 90
    status: "complete"
    value: |
      Subscriber CRM module (Epic 05) — реальна реалізація замість NoOpSubscriberService stub, що споживається 04b-вебхуком (ProcessTelegramUpdateJob).
      Backend:
      - Subscriber entity + repo + service з upsert-from-webhook, manual-unsubscribe, status-machine (active/unsubscribed/blocked/deleted з reactivation на нове /start).
      - Tag entity (окрема колекція tags{projectId, slug, label?, createdAt}) + on-demand counters.
      - CustomFieldDefinition[] embedded у Project (max 20, type=string|number|boolean|date, per-type validation).
      - SubscriberEvent (нова колекція) — append-only history feed, TTL 1y.
      - Segment filter: status + tags_include/_exclude + subscribedAt range (без AND/OR-builder на MVP).
      - Async CSV export job через JobRunr; файли в Mongo GridFS, 7-day retention via ExportCleanupJob; signed-URL download + email notification.
      - TelegramSender error-handler: 403→markBlocked, 400→markDeleted (writer-of-record для transitions з зовнішніх send-сайтів).
      - Rate-limit 100 нових /start per project per minute через Redis bucket (захист від spam-атак); existing subscriber re-/start exempt.
      Frontend (Nuxt):
      - /subscribers list — search (text-index, min 2 chars) + filters (tag include/exclude, status, subscribedAt range) + cursor pagination 50/page + "Export CSV" + "Recent exports" dialog.
      - /subscribers/{id} profile — fields, tags (chips + add/remove), custom-fields edit, history feed (50 latest), actions (manual unsubscribe, send personal message dialog).
      - /tags page — list з counters, rename, delete з confirm.
      - /custom-fields page — schema CRUD (name slug + label + type + defaultValue).
      Замикає Epic 04b stub interfaces, готує grounds для Epic 06 (Funnels) і Epic 07 (Broadcasts).
    gaps: ""
    required: true

  work_type:
    score: 100
    status: "complete"
    value: "feature"
    gaps: ""
    required: true

  user_problem:
    score: 90
    status: "complete"
    value: |
      Без 09-subscribers webhook-worker (04b) пише в no-op stubs → жодних підписників у системі. Юзер бачить підключеного бота, але немає кому слати, нема для кого будувати воронки, нема для кого робити розсилки. CRM-частина MVP, без якої воронки (06) і розсилки (07) фізично не запускаються.
    gaps: ""
    required: true

  target_users:
    score: 75
    status: "complete"
    value: |
      Прямі UI:
      - Project owner (User) — переглядає subscribers list, редагує custom fields, керує тегами, надсилає індивідуальні повідомлення, експортує CSV.
      Непрямі:
      - Telegram subscriber — auto-зареєстрований через /start; може відписатися /stop, може потрапити в розсилку/воронку, отримати персональне повідомлення.
      - Super Admin (Epic 10) — read-only огляд subscribers через admin panel (deferred to Epic 10, цей user-spec лише не блокує).
      - Public REST API клієнти (Epic 08) — CRUD на subscribers + tags + custom fields (deferred to Epic 08; цей user-spec формує internal API, public surface оголошує 08).
    gaps: ""
    required: false

  success_criteria:
    score: 85
    status: "complete"
    value: |
      1. /start від нового tg-user (private chat) → Subscriber з'являється у /subscribers списку із заповненими firstName/lastName/username/languageCode у <2s після події.
      2. Add/remove tag у profile → зберігається синхронно; тег з'являється на /tags з лічильником (on-demand aggregation, allowance for ≤60s Redis cache).
      3. Filter by tag (`tags_include: ['vip']`) на /subscribers повертає правильний набір; cursor pagination коректна на 1k+ subscribers.
      4. CSV-експорт (10k subscribers) запускається асинхронно; за <10 хв job DONE, файл у GridFS, owner отримує email з signed-URL посиланням, "Recent exports" у UI показує DONE з download-кнопкою.
      5. /stop у private chat → Subscriber.status=unsubscribed; наступна броадкаст/воронка не висилається.
      6. Send personal message → TelegramSender catches 403 → Subscriber.status=blocked + event personal_message_failed; 400 chat-not-found → status=deleted.
      7. Custom field type=number приймає 42, "3.14", відмовляє "abc" з HTTP 422; type=date приймає ISO-8601, відмовляє "tomorrow"; type=boolean приймає true/false/"yes"/"no" (TBD у tech-spec).
      8. Rate-limit: спам 200 /start/min від unique tg-users у one project → перші 100 створюють Subscriber'ів, інші 100 ловлять silent ignore + event rate_limit_exceeded; existing subscriber повторні /start не лімітуються.
      9. Reactivation: blocked/unsubscribed/deleted Subscriber → нове /start → status=active, all tags + customFields зберігаються (workflow line 76).
      10. Cross-project isolation: same telegram_user_id у Project A і Project B → ДВА Subscriber-документи з ізольованими tags/customFields/status (project.md role table guarantee).
      11. Subscriber list endpoint P95 <300ms на dataset 1000 subscribers (text-index + cursor pagination).
    gaps: ""
    required: true

  constraints:
    score: 90
    status: "complete"
    value: |
      Stack/runtime:
      - MongoDB sync driver, Spring MVC + virtual threads (architecture.md).
      - Унікальність (projectId, telegramUserId) — обов'язковий compound unique index.
      - Custom fields max 20 полів на проект, embedded у Project.customFieldDefinitions[].
      - SubscriberEvent — окрема колекція, TTL 1 рік на createdAt, indexed (subscriberId, createdAt desc).
      Search/listing:
      - Mongo text-index (firstName, lastName, username), case-insensitive, мін. 2 chars query.
      - Pagination cursor (lastCreatedAt, lastId) base64, 50/page UI, 200 hard cap API.
      - Sort default createdAt desc; alt lastSeenAt desc.
      Tags:
      - Окрема колекція tags{projectId, slug, label?, createdAt}, unique (projectId, slug).
      - On-demand counter aggregation, Redis 60s cache якщо профайл показав >300ms.
      - Sync rename (update_many) і delete ($pull + confirm modal).
      Status state-machine (Q6):
      - active↔unsubscribed: /stop або manual UI button.
      - *→blocked: TelegramSender catches 403 → SubscriberService.markBlocked.
      - *→deleted: TelegramSender catches 400 chat-not-found → SubscriberService.markDeleted.
      - Reactivation: будь-який not-active → active при новому /start (workflow line 76; tags+customFields зберігаються).
      CSV export (Q7):
      - Зберігання у MongoDB GridFS (collection prefix fs.*), 7-day retention via recurring ExportCleanupJob.
      - Signed-URL download endpoint streams з GridFS (HMAC token, 7-day TTL).
      - In-app "Recent exports" + email з посиланням.
      - Job 10 min hard timeout; filter >200k results → 422 при enqueue.
      Rate-limit (Q8):
      - 100 нових /start per project per minute via Redis bucket (key bf:rate:start:{projectId}, INCR + EXPIRE 60s).
      - Existing subscriber re-/start не лімітується.
      - Overflow → event rate_limit_exceeded, без створення Subscriber.
      Frontend:
      - shadcn-vue + Tailwind, uk/en через t('key'), responsive ≥ 768px (ux-guidelines.md).
      Send personal message:
      - TelegramSender.sendMessage(...), text ≤4096 chars (Telegram limit) + UI char counter.
      Tag slug:
      - To clarify: regex `^[a-z0-9_-]{1,32}$` (kebab/snake, max 32 chars) — recommend default.
    gaps: ""
    required: true

  testing_strategy:
    score: 90
    status: "complete"
    value: |
      Unit:
      - SubscriberStatusMachine: усі transitions з усіх початкових станів + reactivation rules.
      - SegmentFilterBuilder: DTO {status, tags_include[], tags_exclude[], dateRange} → Mongo query Document.
      - CsvBuilder: BOM, UTF-8, escape (";"/quotes/newlines), header order, tags-join, customFields-as-json.
      - CustomFieldValidator: per-type strict validation (string trim/maxLen, number parse, boolean coerce, date ISO-8601).
      - TelegramTextValidator: length 1..4096, non-blank.
      - TagSlugValidator: regex ^[a-z0-9_-]{1,32}$.
      - RateLimitGuard: Redis bucket counter (можна замокати Lettuce у unit, але краще покривати в integration).
      Integration (@SpringBootTest + Testcontainers Mongo + embedded Redis або mockito-bean для Lettuce):
      - Webhook end-to-end: ProcessTelegramUpdateJob → SubscriberService.upsertFromTelegramUpdate створює Subscriber + event subscriber_created (замінює NoOp).
      - /stop: status flip + event manual_unsubscribe.
      - Re-/start від blocked/unsubscribed/deleted → active, tags збереглись.
      - Cross-project isolation: same telegramUserId у двох проектах = 2 Subscriber.
      - Tags CRUD + rename cascade (≥10 subscribers) + delete з $pull + counters aggregation.
      - CustomField schema CRUD + value set/edit + per-type validation 422.
      - List endpoint: search text-index + filter combinations + cursor pagination + sort.
      - CSV export: enqueue job → run → GridFS file written + email enqueued (JavaMailSender mock + GridFsTemplate read) + signed-URL endpoint serves file + cleanup-job deletes after 7d.
      - Send personal message: success-path + TelegramSender 403 → status=blocked + event + 400 → deleted + 429 → retry-then-surface.
      - Access control: ProjectService.requireOwned guards on every endpoint (anti-IDOR test).
      - Rate-limit: 100 нових /start succeed, 101-й — silent ignore + event; existing subscriber повторні /start unaffected.
      E2E Playwright (golden path):
      - login → /projects → click project → /subscribers → search "test" → click row → /subscribers/{id} → add tag → /tags → see tag з counter → export CSV → "Recent exports" → download.
      Staging-smoke (docs/staging-smoke/09-subscribers.md):
      - ngrok tunneled local backend → BotFather throwaway bot → Connect у UI → /start від tg → Subscriber у /subscribers UI → add tag → /stop → status flip → export → email прийшов.
    gaps: ""
    required: true

# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
phase2_user_experience:

  user_stories:
    score: 90
    status: "complete"
    value: |
      S1 (auto-register). Telegram-юзер пише /start новому боту проекту → ProcessTelegramUpdateJob викликає SubscriberServiceImpl.upsertFromTelegramUpdate → новий Subscriber створений (status=active, tags=[], customFields={}); event subscriber_registered записаний у subscriber_events. Owner відкриває /subscribers і бачить його за <2s.
      S2 (re-/start activity refresh). Той самий юзер пише будь-який текст → upsert оновлює lastSeenAt і застарілі поля (firstName/username), без створення нового документа.
      S3 (reactivate from inactive). Той самий юзер після /stop (status=unsubscribed) знов /start → status=active, tags та customFields збережені; event subscriber_reactivated.
      S4 (rate-limit guard). 200 unique tg-users одночасно надсилають /start у проект A за 60s → перші 100 створюють Subscriber, 101-200 ловлять silent ignore + event rate_limit_exceeded; existing-subscriber повторні /start у тому самому вікні НЕ лімітуються.
      S5 (view list + search/filter/paginate). Owner на /subscribers вводить "iva" у пошук → text-index повертає Ivan/Ivanna; додає filter `tags_include=vip` + `status=active` → перевіряє 50 рядків; гортає cursor pagination до 4-ї сторінки.
      S6 (view profile + history). Owner клік на рядок → /subscribers/{id} показує: identity-картку, tags chips, custom fields edit, history feed (50 останніх subscriber_events).
      S7 (add/remove tag). Owner у profile натискає "Add tag" → autocomplete з існуючих project-tags + опція "Create new"; додає `vip` → API POST /tags-assign; tag-counter на /tags оновлюється at next aggregation request.
      S8 (manual unsubscribe). Owner у profile натискає "Manual unsubscribe" → confirm → status=unsubscribed, event subscriber_unsubscribed{reason:"manual"}. Subscriber не отримує наступну broadcast/funnel.
      S9 (send personal message). Owner у profile відкриває dialog "Send personal message" → textarea (max 4096 chars + counter) → Send → TelegramSender.sendMessage; на 200-OK → event personal_message_sent + toast "Sent"; на 403 → event personal_message_failed{reason:"blocked"} + Subscriber.status=blocked + toast "Subscriber blocked the bot"; на 400 chat-not-found → status=deleted; на 429 → retry-with-backoff, потім toast "Telegram rate limit, try later".
      S10 (define custom field schema). Owner у /custom-fields натискає "Add field" → name (slug regex `^[a-z0-9_-]{1,32}$`, immutable після save) + label + type (string|number|boolean|date) + optional defaultValue → save. У Project.customFieldDefinitions[] з'являється новий запис; cap-check 20.
      S11 (set custom field value). Owner у subscriber profile редагує value поля city="Київ" → validation per type (number: parseDouble; date: ISO-8601; boolean: true/false/yes/no) → save. Save zapisuje у Subscriber.customFields{city:"Київ"} + event subscriber_custom_field_set.
      S12 (delete custom field definition). Owner видаляє field `city` → confirm "20 subscribers have a value for this field. Deleting will remove their data. Continue?" → backend $unset на всіх subscribers + cascade видалення з definition[]. Event custom_field_definition_deleted.
      S13 (rename custom field label). Owner редагує label "Місто" → "Город" → save (тільки label) → instant update.
      S14 (manage tags). Owner у /tags бачить список з counters; редагує label, видаляє тег → confirm modal → cascade $pull на subscribers; event tag_deleted.
      S15 (export CSV). Owner у /subscribers натискає "Export CSV" з поточними filter'ами → API POST creates subscriber_exports row (status=PENDING) + enqueues ExportSubscribersJob; UI показує toast "Export started". Job стрімить cursor-by-cursor у GridFS, status=DONE, sendExportReadyEmail з signed URL. У UI "Recent exports" dialog показує row з кнопкою Download.
      S16 (download exported CSV). Owner клікає Download → endpoint перевіряє HMAC signed URL + expiresAt + ownership → стрімить InputStreamResource з GridFS; Content-Disposition attachment.
      S17 (concurrent export attempt). Owner натискає Export ще раз поки PENDING/RUNNING → API повертає 409 export_in_flight; UI показує банер "Export already running".
      S18 (export cleanup). За добу `ExportCleanupJob` видаляє GridFS-файли старші 7d; subscriber_exports.status переходить у PURGED; download endpoint → 410 Gone.
      S19 (project soft-delete cascade). Owner soft-delete'ить проект → /subscribers, /tags, /custom-fields усі endpoints на цей projectId → 404. Існуючі signed export URLs → 410. Після 7-day retention `ProjectHardDeleteJob` видаляє subscribers + subscriber_events + tags + subscriber_exports + GridFS-файли.
      S20 (cross-project isolation). Той самий tg-user пише `/start` у проект A і проект B → два окремих Subscriber-документа (project.md role-table guarantee).
    gaps: ""
    required: true

  acceptance_criteria:
    score: 95
    status: "complete"
