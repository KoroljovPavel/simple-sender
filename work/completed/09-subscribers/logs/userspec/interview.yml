  risks:
    score: 90
    status: "complete"
    value: |
      R1. CSV export OOM на 100k+ subscribers. Mitigation: streaming MongoTemplate cursor + PipedOutputStream → GridFS upload без in-memory list. Test under @Tag("slow") with 50k seeded subscribers + heap-size assertion.
      R2. Tag rename cascade на 10k+ subscribers — sync update_many може блокувати event loop. Mitigation: threshold 10k → async TagRenameJob; UI шенерує банер "Renaming in progress" + опрос status. Env var SUBSCRIBER_TAG_RENAME_SYNC_THRESHOLD.
      R3. Custom field type=immutable обмеження може незадовольнити юзера (Q13 B). Mitigation: документувати у user-spec обмежень; UI показує warning при create "Type cannot be changed later"; delete-and-recreate доступний як ескейп.
      R4. Race на tags collection unique index — паралельні find-or-create. Mitigation: DuplicateKeyException catch у TagService + retry-read (per BotService.connect precedent).
      R5. Race на 20-field cap — паралельні CustomFieldDefinition inserts. Mitigation: post-write count check + cleanup last-inserted якщо overflow. Або use $push з conditional (size < 20) в mongo aggregation pipeline — TBD у tech-spec.
      R6. Cross-project isolation — same tg_user_id у двох проектах. Mitigation: compound unique (projectId, telegramUserId) + service-level check; integration test CrossProjectIsolationIT.
      R7. Index size on (projectId, tags) при 100k subscribers × avg 5 tags. Estimate: 500k index entries × ~20 bytes = ~10MB. Acceptable for MVP. Mitigation: monitoring (Epic 09).
      R8. Text-index size на (firstName, lastName, username). Estimate: ~150 bytes per subscriber. На 100k = 15MB. Acceptable. Mitigation: deferred Atlas Search якщо >1M.
      R9. Signed URL security: HMAC key compromise → all signed URLs leaked. Mitigation: env var SUBSCRIBER_EXPORT_TOKEN_KEY (rotated quarterly), short expiry 7d. Audit: subscribers_export_downloaded event.
      R10. TelegramSender constructor injection: cyclic dependency Subscriber↔Bot↔TelegramSender? Mitigation: ApplicationContext-level check — SubscriberService doesn't inject TelegramSender (one-way). Subscriber events go through EventService (no cycle).
      R11. Existing 04b NoOpSubscriberService is `@Service` (not `@Primary`). Two @Service з same interface → Spring fail. Mitigation: delete NoOp (or @Primary on real impl + retain NoOp for test slices). Recommend delete (simpler).
      R12. ExportSubscribersJob long-running (10 min cap) може блокувати JobRunr workers — backpressure. Mitigation: JobRunr concurrency=4 default, max 4 simultaneous exports across all projects (АС17 per-project одна in-flight, але cross-project 4); якщо більше — JobRunr queues. Acceptable MVP.
      R13. GridFS query performance на purge sweep. Mitigation: prelookup `subscriber_exports.fileId` doc IDs з status=DONE створення<now-7d → batch-delete за doc IDs. Запит на fs.files без index = TS, але 1×/day OK.
      R14. ProjectHardDeleteJob extension complexity — додаємо 5 нових cascade steps. Mitigation: test ProjectHardDeleteJobIT extension; document order: subscribers → subscriber_events → tags → subscriber_exports + GridFS → project doc.
      R15. Rate-limit fail-open під час Redis outage → spam-атака під час outage пройде. Mitigation: fail-open is codebase convention; ризик прийнятий per Q8. Monitoring у Epic 09 додасть alert на Redis-down.
      R16. Subscriber profile history feed 50 events — на active subscribers може швидко зростати (100+ events/день). Mitigation: profile fetch query LIMIT 50 + sort createdAt desc; "Load more" optional у Phase 2 спека (не required MVP).
      R17. Custom field rename limitation (Q13 B). UX disutility — owner може хотіти "rename city to town" без втрати даних. Workaround: delete + create + bulk re-set values via API. MVP accepts limitation. Phase 2: add rename via JobRunr-job з $rename.
