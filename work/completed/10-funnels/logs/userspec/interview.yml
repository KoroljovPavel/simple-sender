      - Staging-smoke (docs/staging-smoke/10-funnels.md): реальний бот + ngrok → deep-link /start ref_x → проходження → /stop.
      Delay-timing детермінується інʼєкцією java.time.Clock (reuse ClockConfig) + ручним викликом sweep-методу
