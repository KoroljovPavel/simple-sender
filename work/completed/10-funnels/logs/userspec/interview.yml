  - question_num: 1
    timestamp: "2026-05-31 00:10:00"
    topic: "cycle1: step set, send-image source, /start deep-link payload + conflict rule, delay granularity"
    agent_question: |
      1. Перелік кроків фази 1 (6 лінійних: Send Message text-only, Send Image, Wait/Delay, Add Tag,
         Remove Tag, Set Custom Field; без End Funnel)?
      2. Send Image — URL-only у фазі 1 (upload → пізніше)?
      3. /start тригер: (а) deep-link payload (t.me/bot?start=ref_promo → /start ref_promo, ≤64 chars,
         [A-Za-z0-9_-]); у редакторі генеруємо посилання. (б) конфлікт: дві active-воронки з однаковим
         (/start, trigger_value) — заборона на валідації (A)?
      4. Затримка: одиниці хв/год/дні, мінімум 1 хв, точність ±~30с (через JobRunr ~30s scheduler) (A)?
    user_answer: |
      1. Набір ок, End Funnel не потрібен.
      2. Ок, тільки URL.
      3. Хочу через глибоке посилання /start (= deep-link payload, пояснено). 3б — A.
      4. (уточнення: крок 'Затримка' — автор вказує тривалість+одиницю; мій scheduler-нюанс прийнято) — A.
    summary: |
      LOCK-INS Cycle 1:
      - Step set фази 1 = 6 лінійних типів (Send Message TEXT-ONLY, Send Image URL-only, Delay, Add Tag,
        Remove Tag, Set Custom Field). НЕ: Wait-for-Reply, Branch, Menu, End Funnel (кінець списку = завершення).
      - Send Image = URL + caption, без upload (upload → фаза 4 / improvement).
      - Тригер /start з опц. deep-link payload (trigger_value). Редактор показує готове посилання
        t.me/<bot>?start=<payload> + копіювати. Голий /start = trigger_value порожній.
      - Конфлікт (3б=A): не дозволити активувати другу active-воронку з тим самим (/start, trigger_value);
        різні payload співіснують; голий /start = окремий слот.
      - Затримка (4=A): одиниці хвилини/години/дні, мінімум 1 хв; точність ±~30с (JobRunr recurring ~30s),
        задокументувати; секунди НЕ підтримуємо.
  - question_num: 2
    timestamp: "2026-05-31 01:00:00"
    topic: "cycle2: mid-flight edits, status lifecycle+delete, re-enter, send-failure semantics, execution retention"
    agent_question: |
      Після code-research (work/10-funnels/code-research.md). Поведінкові рішення:
      1. Редагування воронки з активними виконаннями → snapshot кроків на виконання (правки = лише нові запуски)?
      2. Статуси: draft не тригериться; active ловить; paused — нові не створюються, активні дограють.
         Видалення воронки скасовує активні виконання + підтвердження. Активація лише валідної (≥1 крок).
      3. allow_re_enter=true при повторному /start: (A) скасувати старе й почати заново, чи (B) паралельні потоки?
         За замовчуванням false (повторний /start ігнорується поки активне).
      4. Збій send: 403/400-chat-not-found → TelegramSender сам flip blocked/deleted, виконання=cancelled;
         інші (5xx exhausted/4xx) → failed (без додаткових ретраїв воронки). Send/старт лише для active підписників;
         перед кожним send перевірка статусу, не-active → cancel.
      5. Ретенція виконань: (A) безстроково (re-enter guard + майбутня аналітика) чи (B) TTL 90д на completed/cancelled/failed?
    user_answer: "1 snapshot, 2 ok, 3 A, 4 ok, 5 A"
    summary: |
      LOCK-INS Cycle 2:
      - Mid-flight edit = SNAPSHOT step list onto FunnelExecution at start; funnel edits affect only NEW runs;
        in-flight executions finish on their snapshotted version. No edit-lock on active funnels.
      - Status lifecycle: draft (no trigger) / active (triggers) / paused (no new executions, active ones finish).
        Delete funnel → cancel all active executions + confirm dialog. Activate only valid funnel (≥1 step, required fields filled).
      - allow_re_enter=true → (A) CANCEL old active execution + restart fresh (no parallel streams). Default false →
        repeat /start ignored while an execution is active (running OR waiting).
      - Send-failure semantics: 403/400-chat-not-found → TelegramSender auto-flips subscriber (Decision 4),
        execution → cancelled (expected end). Other terminal (5xx-exhausted / other 4xx) → execution failed,
        persisted/visible, NO extra funnel-level retries (TelegramSender already retries internally).
        Funnel sends/starts ONLY for ACTIVE subscribers; pre-send status check, non-active → cancel execution.
      - Execution retention = (A) keep forever in phase 1 (re-enter guard + analytics epic reads them); TTL is
        an analytics-epic decision.
  - question_num: 3
    timestamp: "2026-05-31 01:30:00"
    topic: "cycle3: testing matrix, deploy + env vars, verification boundary"
    agent_question: |
      6. Testing matrix: unit (step executors, VariableTemplateRenderer, state transitions, trigger-matcher,
         funnel validation) + integration (AbstractIntegrationTest + Testcontainers Mongo + JobRunr in-memory +
         MockWebServer: trigger→run, Delay→nextRunAt+resume, idempotency, /stop cancel, paused, re-enter,
         atomic-claim race, send-fail 403→cancelled/5xx→failed, requireOwned+cross-project, snapshot,
         ProjectHardDeleteJob cascade) + Playwright E2E (editor) + staging-smoke. Delay timing made
         deterministic via Clock injection (ClockConfig exists) + manual sweep invocation.
      7. New env vars: FUNNEL_SCHEDULER_INTERVAL_SECONDS (30), FUNNEL_MAX_STEPS (~50). Other limits needed?
      8. Verification boundary: local (Docker Compose + MockWebServer + manual sweep) vs staging (real bot + ngrok).
    user_answer: "6 ok. 7 в нас зараз немає ci/cd, тому ок. 8 Ок, я все буду тестити локально з телеграмом."
    summary: |
      LOCK-INS Cycle 3:
      - Testing matrix accepted as proposed. Delay determinism = inject java.time.Clock (reuse ClockConfig) +
        call the sweep/step-runner bean method directly in tests (mirrors HardDeleteJobTest / ExportCleanupJobIT).
      - Deploy: THERE IS NO CI/CD YET (correction to earlier PK assumption). Funnels ships without a pipeline;
        env vars (FUNNEL_SCHEDULER_INTERVAL_SECONDS=30, FUNNEL_MAX_STEPS=50) go to .env.example + docs/local-setup.
        No CI secrets step. Per-project funnel limits beyond MAX_STEPS deferred; existing /start rate-limit
        (epic 09, 100/min) already throttles mass execution starts. Production index mgmt = annotation-driven
        auto-index-creation=true (existing convention), no @PostConstruct ensureIndex.
      - Verification: USER will test end-to-end LOCALLY with REAL Telegram (local backend + ngrok tunnel +
        BotFather throwaway bot + deep-link /start). Automated coverage (unit+integration+E2E) runs locally via
        gradlew/vitest/playwright. staging-smoke runbook (docs/staging-smoke/10-funnels.md) authored but executed
        locally-with-ngrok rather than on a separate staging host (no deployed env yet).
  - question_num: 4
    timestamp: "2026-05-31 02:00:00"
    topic: "cycle3 gap-closure: multi-replica sweep, bot pinning, parse_mode, deleted-custom-field"
    agent_question: |
      Закриття gaps від completeness-checker:
      A. Кілька інстансів бекенду одночасно у фазі 1? (визначає механізм sweep)
      B. Бот reconnect посеред активних виконань: (A) пін telegramBotId на execution, не-CONNECTED→failed;
         (B) щоразу резолвити поточного CONNECTED-бота.
      C. parse_mode у Send Message: picker None/HTML/MarkdownV2, default None?
      D. Custom-field визначення видалене поки вживається кроком Set Custom Field: (A) skip+continue / (B) failed.
    user_answer: "A точно кілька реплік. B A. C Ок. D A."
    summary: |
      LOCK-INS gap-closure:
      - MULTI-REPLICA confirmed → sweep MUST be JobRunr @Recurring with distributed lock (NOT Spring @Scheduled).
        Atomic per-execution findAndModify claim is the second layer so two replicas never run the same step.
      - Bot pinning = (A): snapshot telegramBotId onto FunnelExecution at start; if that bot is no longer
        CONNECTED at send time → execution failed (do NOT silently switch to a different reconnected bot).
      - parse_mode = picker None / HTML / MarkdownV2 in editor, DEFAULT None (plain text — safest with variable
        substitution, won't break on special chars in names).
      - Deleted custom-field definition mid-execution (Set Custom Field step references a now-removed field) =
        (A): silently skip the step + continue (mirrors controller dropping unknown keys); do NOT fail execution.
      Agent-resolved minor gaps (recorded, not asked): re-enter guard = atomic unique partial index
      (funnelId, subscriberId) on active executions, "active"=running OR waiting; subscriber missing at fire()
      (deleted between upsert and fire) → log + skip; Set-Custom-Field logic extracted to shared service
      (callable from controller + engine, no request-scope deps); per-funnel active-execution count NOT in phase 1
      (analytics epic); Playwright E2E adds trigger-config + deep-link Copy flow.

