      NoOpFunnelTriggerService stub (споживається 04b-вебхуком ProcessTelegramUpdateJob).
      Backend:
      - Funnel entity (нова колекція funnels) — embed step list [{type, config, order}], назва/опис/статус (draft/active/paused), trigger definition, execution settings (allow_re_enter).
