      - Превʼю повідомлень + drag-and-drop — НЕ у фазі 1 (превʼю → фаза 4; canvas → nice-to-have).
      Конвенції: shadcn-vue + Tailwind; усі рядки через t('funnels.*'); i18n parity gate (uk+en); useApi/useApiError
      (errors.funnels.*); компоненти за зразком components/customFields/* (List + Add/Edit Dialog); store funnels.ts.
      Toasts: "Funnel activated", "Step added", "Funnel deleted" тощо.
    gaps: ""
    required: false

  risks:
    score: 85
    status: "complete"
    value: |
      R1. Дублювання повідомлень при JobRunr retry / рестарті. Mitigation: atomic claim (findAndModify CAS,
          pending→in_progress→done) ПЕРЕД send; re-entry guard на claimed/done. At-most-once per step.
      R2. Drift таймінгу Delay (sweep ~30с). Mitigation: документувати ±~30с; мін 1 хв; для drip це невидимо.
      R3. Навантаження sweep на великій базі executions. Mitigation: індекс (status, nextRunAt); atomic-claim
          обмежує батч; масовий старт стримується наявним /start rate-limit (epic 09, 100/min).
      R4. Зміна воронки під час активних execution. Mitigation: snapshot кроків на execution при старті.
      R5. fire() кидає виняток і поронить webhook-обробку. Mitigation: real fire() idempotent + swallow/log
          власних помилок; не дати raw_update піти у FAILED+retry.
      R6. Дві @Service FunnelTriggerService → context startup fail. Mitigation: ЗАМІНИТИ NoOp (не додавати другий бін).
      R7. Бот reconnect посеред воронки змінює telegramBotId/ownerChatId. Mitigation: рішення пінінгу бота → tech-spec.
      R8. Send у неактивний чат. Mitigation: pre-send status-check; non-active → cancel execution (не покладатись на bounce).
