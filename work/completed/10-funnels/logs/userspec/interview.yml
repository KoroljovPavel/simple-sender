        (хв/год/дні, мін 1 хв), Add Tag, Remove Tag, Set Custom Field (валідація через CustomFieldValueValidator).
      - Templating: {user.first_name|last_name|username}, {custom.<key>}, unknown→"", {{ escape.
      - Тригер: deep-link /start ref_x → виконання воронки з trigger_value=ref_x; голий /start → trigger_value="".
        Активація блокується при конфлікті (/start, trigger_value) з іншою active.
      - Engine: проходження кроків; Delay через nextRunAt + sweep (±~30с); at-most-once per step (idempotency
        через atomic claim); /stop → cancel; paused → no new; delete → cancel active; send-fail 403/400→cancelled
        + blocked/deleted, інші→failed; send/start лише для active підписників.
      - allow_re_enter=false ігнорує повторний /start поки активне; =true cancel+restart.
      - Snapshot: правка воронки не змінює поведінку активних виконань.
      - ProjectHardDeleteJob cascade видаляє funnels + funnel_executions.
    gaps: ""
    required: true

  edge_cases:
    score: 85
    status: "complete"
    value: |
      EC1. Редагування active-воронки з активними execution → snapshot захищає; in-flight доходять за старою версією.
      EC2. Видалення воронки з активними execution → усі cancelled перед видаленням.
      EC3. Невідома змінна / порожнє поле в шаблоні → "" (без падіння виконання). {{ → літерал {.
      EC4. Підписник unsubscribed/blocked/deleted під час виконання → pre-send status check → execution cancelled
          (не шлемо в неактивний чат).
      EC5. Конфлікт двох active-воронок на однаковому (/start, trigger_value) → блокується на активації (валідація).
      EC6. Голий /start vs /start ref_x — різні слоти, співіснують.
      EC7. Race: два інстанси беруть одне due-execution → atomic findAndModify claim, програвший — no-op.
      EC8. JobRunr retry / рестарт worker посеред кроку → claimed in_progress/done крок не пере-надсилається.
      EC9. Delay 5с не підтримується (мін 1 хв); точність ±~30с від sweep.
      EC10. fire() кидає виняток → НЕ має поронити webhook-обробку (idempotent / swallow+log), інакше raw_update
           марковано FAILED і ретраїться разом із повторним upsert + повторним fire.
      EC11. Кінець списку кроків = завершення воронки (немає явного End Funnel).
      EC12. Бот reconnect посеред воронки (telegramBotId/ownerChatId змінюються) — як execution пінить бота (→ tech-spec).
    gaps: ""
    required: true

  error_scenarios:
    score: 85
    status: "complete"
    value: |
      ER1. Send 403 (заблокував) → TelegramSender markBlockedByChatId; execution cancelled.
      ER2. Send 400 chat-not-found → markDeletedByChatId; execution cancelled.
      ER3. Send 429 → TelegramSender internal retry+backoff; якщо вичерпано → термінально → execution failed.
      ER4. Send 5xx exhausted / інші 4xx → execution failed (persisted, видно автору); без funnel-level ретраїв.
      ER5. Активація невалідної воронки (0 кроків / порожнє обовʼязкове поле / конфлікт тригера) → 422 з кодом.
      ER6. Set Custom Field з невалідним значенням типу → 422 custom_field_type_mismatch (через CustomFieldValueValidator).
      ER7. Невідомий тег у Remove Tag → no-op (idempotent removeTag).
      ER8. Mongo/JobRunr недоступні під час sweep → крок не claimed, повтор на наступному прогоні (at-most-once збережено).
      ER9. requireOwned fail (чужий/soft-deleted/невалідний projectId) → uniform 404.
    gaps: ""
    required: true

  verification_strategy:
    score: 85
    status: "complete"
    value: |
      During development (no deploy needed):
