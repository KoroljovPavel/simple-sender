           payload) → exact-match trigger_value. fire() idempotent + swallow/log.
      TD6. Send Image: новий sendPhoto у TelegramSender (reuse retry/429/Decision-4 hook), не sibling.
      TD7. Set Custom Field: винести validate→update→recordCustomFieldsSet у спільний сервіс (нема
