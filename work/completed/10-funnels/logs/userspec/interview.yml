      S3 (set trigger + deep link). У налаштуваннях воронки обирає тригер /start + опц. trigger_value (payload);
      UI показує готове посилання t.me/<bot>?start=<payload> з кнопкою "Скопіювати".
      S4 (activate). Тисне "Activate" → валідація (≥1 крок, усі обовʼязкові поля, немає конфлікту (/start,trigger_value)
