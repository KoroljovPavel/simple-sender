      - Шаблонізація змінних у текстах ({user.first_name|last_name|username}, {custom.field}, невідома→"", {{ escape).
      - Engine: funnel_executions collection (per-subscriber state machine), JobRunr recurring job (~30s) забирає прострочені nextRunAt; idempotency (pending→in_progress→done per step), SELECT-FOR-UPDATE-аналог через Mongo atomic findAndModify / SKIP-LOCKED-аналог.
