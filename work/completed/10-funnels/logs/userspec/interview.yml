      - Інтеграція: замінити NoOpFunnelTriggerService реальним @Service (єдиний бін); fire/cancelActiveFor викликаються ProcessTelegramUpdateJob.
      - Subscriber status: воронка стартує/шле тільки для active підписників (pre-send check; broadcast/funnel фільтрують active).
      - Add Tag / Remove Tag / Set Custom Field — через subscriber-сервіси; subscriber_events sole-writer (patterns.md, не форкати).
      - Delay через nextRunAt (НЕ Thread.sleep); мін 1 хв; точність ±~30с.
      - Telegram ліміт тексту 4096; deep-link payload ≤64 chars [A-Za-z0-9_-].
