      - Зупинка: /stop → cancelActiveFor; статус paused → нові execution не створюються, активні дограють.
      Frontend (Nuxt):
      - Список воронок у проєкті (фільтр за статусом) + CRUD + базовий вертикальний редактор кроків (+Add step, ↑↓, видалити, редагувати).
