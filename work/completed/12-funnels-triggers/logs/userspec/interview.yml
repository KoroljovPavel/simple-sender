  user_detail_level: "detailed"  # brief | moderate | detailed

# ============================================================================
# Notes
# ============================================================================
notes: |
  KEY INSIGHTS / DECISIONS (Cycle 1):
  - Scope = FIVE triggers: keyword, tag_added, custom_field_set (NEW), api-event, + EMIT_EVENT step.
  - Subscriber-scoped: every trigger fires for ONE subscriber -> one FunnelExecution. No project-wide
    "start funnel for a segment" (that is broadcasts).
  - External identity for API events: proposing telegramUserId as primary (zero new mechanism, lookup
    via existing unique (projectId, telegramUserId); API users key their CRM on it). Also accept our
    subscriberId if given. Short-id mechanism = deferred ergonomics (YAGNI now). TO CONFIRM.
  - DE-RISK INSIGHT: fan-out (1 event -> N funnels) is achieved by N separate funnels each carrying the
    event trigger -> needs only relaxing the partial-unique index (keep unique for on_start, drop for
    event), NOT List<Trigger>. Multiple triggers on ONE funnel = Epic 8 (multi-entry), OUT of Phase 3.
    => Phase 3 keeps single triggerType/triggerValue per funnel; data model change is just the index.
  - tag_added + custom_field_set fire from SubscriberServiceImpl / SubscriberCustomFieldsService (sole
    writers, already emit subscriber_events). ALL sources (manual UI, funnel step, API) should fire ->
    CASCADE/LOOP risk (funnel Add-Tag step -> tag trigger -> funnel...). Loop protection needed (Cycle 2).
  - UI-vs-canvas: config FORMS (trigger-type selector, EMIT_EVENT node form) migrate to canvas; only
    list-layout chrome is throwaway (cheap). Non-technical authors need keyword/tag/field config UI ->
    build MINIMAL editor UI now; no multi-trigger-per-funnel UI (not needed since fan-out = separate funnels).
  CYCLE-1 CONFIRMED (batch 2-3):
  - custom_field_set trigger: fire on ANY set/change, no value predicate v1. ✓
  - API identity: telegramUserId primary (+ optional internal subscriberId); unknown -> 404/no-op,
    event never auto-creates a subscriber; event `data` payload NOT mapped into funnel vars v1. ✓
  - Index strategy: relax partial-unique (keep unique for on_start, drop for event) — NOT List<Trigger>. ✓
  - Loop protection: per-subscriber enroll rate-limit (covers A->B->A that re-enter guard misses). ✓
  - Keyword: contains, case-insensitive, multiple keywords per trigger (any match); precedence:
    in-flight waiting_for_reply WINS over keyword-trigger start. ✓
  - Migrations: variant (ii) — ship index change via hand-rolled idempotent startup migration
    (FunnelStepIdBackfill pattern), user does NOT drop indexes by hand; adopt Mongock as the NEXT
    separate task (recorded in improvements.md). Root cause: auto-index-creation=true. ✓
  - API rate-limit on /api/v1/events: fixed global default (~300/min) now via existing Redis counters;
    per-project + super-admin-editable = future (monetization). ✓
  - PUBLIC-API FOUNDATION (scope expansion, user-driven): api-event needs api-key auth, which is not
    built yet (Epic 08 territory). Decision: build MINIMAL foundation now, designed for Epic 08 to
    extend — (a) generate 1 primary API key ON PROJECT CREATION (store hash+prefix per api_keys schema,
    plaintext shown once), (b) backfill API keys for EXISTING projects (startup migration), (c) api-key
    auth filter on /api/integrations/** (matches all versions), (d) cohesive versioned namespace
    /api/integrations/v1/** — version INSIDE the namespace so the external API versions independently of
    the session cabinet /api/v1/projects/**. NOT one mega-endpoint; POST /api/integrations/v1/events is
    the first resource; future /api/integrations/v1/subscribers + /funnels (Epic 08) reuse the rails.
    Project comes from the API key (no {projectId} in path), unlike the cabinet (path + session).
  NAMESPACE DECISION (final): /api/integrations/v1/** confirmed by user (chose "integrations" over
    external/public; version inside namespace over /api/v1/integrations).
  CYCLE 2 CONFIRMED (code-informed):
  - Keyword: dedicated keywords:List<String> field (NOT triggerValue), lowercase, contains, case-insensitive,
    any-of-many. Precedence: subscriber in waiting_for_reply -> keyword SUPPRESSED (don't yank from menu;
    free text ignored/logged as today).
  - Loop guard: per-subscriber AUTO-enroll rate-limit, 20/min, Redis fail-open. Counts only auto-enrolls
    (step/tag/field/event), NOT human-initiated (manual/start/keyword). No depth-guard in v1.
  - API key (REVISED): do NOT auto-generate on project create, NO backfill. Lazy: project settings has a
    "Generate" button (first time) then "Regenerate" (after). Plaintext shown once per (re)generation.
    Stored hash-only (Sha256Hex). Projects without a generated key simply can't call /api/integrations.
  - Small models: tag_added->triggerValue=tagSlug; custom_field_set->triggerValue=fieldKey;
    api-event & EMIT_EVENT->event_name (slug, shared namespace); EMIT_EVENT emits for the running
    subscriber (subscriber-scoped). Internal dispatcher named distinctly (FunnelEventService), NOT EventService.
  AREAS OF UNCERTAINTY: keyword match semantics (contains/exact/case); custom_field_set value predicate
    (likely no — fire on any change, value-condition = nice-to-have conditional branching); event `data`
    payload mapping into funnel variables (likely defer); precedence keyword-trigger vs in-flight waiting_for_reply.

# ============================================================================
# USAGE INSTRUCTIONS
# ============================================================================
#
# 1. INIT: Created by init-feature-folder.sh at work/{feature}/logs/userspec/interview.yml
#    Set metadata.started, metadata.status: in_progress
#
# 2. INITIAL SCORING: After user's free-form description, score ALL items
#    Detailed 80-95%, brief 50-70%, vague 20-40%, not mentioned 0%
#
# 3. INTERVIEW LOOP (save after EVERY response):
#    a) Find required items with score < 85% in current cycle scope
#    b) Ask 3-4 questions about different gaps
#    c) Propose solutions based on PK
#    d) User answers
#    e) Update: conversation_history, scores, values, gaps, metadata
#    f) Save immediately
#    g) Check stop criteria (score >= 85% AND structural: value filled, no TBD, gaps resolved)
#    h) Not done → repeat. Done → next cycle.
#
# 4. CYCLES:
#    Cycle 1: phase1_feature_overview items
#    Cycle 2: phase2_user_experience + phase3_integration items
#    Cycle 3: ALL items still below threshold (cleanup pass)
#
# 5. RESUME: If metadata.status is "in_progress"
#    Load, show conversation summary, resume from current state
#
# 6. COMPLETION: After user approves user-spec.md
#    Set phase4_completion.status: approved
#    Set metadata.status: completed
