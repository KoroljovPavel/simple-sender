# Interview Plan for Feature Planning
#
# Tracks progress of adaptive discovery interview for a new feature/bug/refactoring.
# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-06-07 13:06:26"
  last_updated: "2026-06-07 13:06:26"
  status: "completed"  # not_started | in_progress | completed
  can_resume: true
  current_question_num: 0
  feature_size: "L"  # S | M | L — new trigger types + event pub/sub + 1:N schema/index change

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history:
  - question_num: 1
    timestamp: "2026-06-07 13:06:26"
    topic: "scope / subscriber-scoping / value / UI-vs-canvas"
    agent_question: |
      Batch 1: (1) all four sub-features in one spec? (2) triggers subscriber-scoped + how does
      API identify the subscriber? (3) which job-to-be-done is priority? (4) testing strategy +
      how much UI now given a future canvas?
    user_answer: |
      (1) All four. Also asked: should there be a trigger on a subscriber receiving/changing a
      custom-field variable? It matters too.
      (2) Yes, subscriber-scoped is correct. For API they must give our user id — maybe invent a
      "short id" mechanism for subscribers for convenience? Or take telegramUserId so API users
      can send for themselves.
      (3) All three jobs equal.
      (4) Think about it: if we move config to a canvas later, do we even need config UI now, or
      will it migrate?
    summary: >
      All 4 in scope + a 5th trigger requested (custom_field_set). Subscriber-scoped confirmed;
      open: external identity (telegramUserId vs internal id vs short-id). All 3 jobs equal.
      UI scope to be decided against the future-canvas migration question.
