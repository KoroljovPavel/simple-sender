# Interview Plan for Feature Planning
#
# Tracks progress of adaptive discovery interview for a new feature/bug/refactoring.
# Updated after EACH user response with scoring, values, and remaining gaps.
#
# Scoring: 0-100% (how well we understand this aspect)
# Status: pending → partial → complete
# Required: true = must reach threshold, false = cover if relevant

# ============================================================================
# Interview Metadata (Session Recovery)
# ============================================================================
interview_metadata:
  started: "2026-06-10 18:20:47"
  last_updated: "2026-06-10 20:00:00"
  status: "completed"  # not_started | in_progress | completed
  can_resume: true
  current_question_num: 4
  feature_size: "M"  # per Epic 7 complexity call in funnels-future-epics.md, confirm with user

# ============================================================================
# Conversation History (for session recovery)
# ============================================================================
# Preserves complete Q&A. Update after EVERY user response.
#
conversation_history:
  - question_num: 1
    timestamp: "2026-06-10 18:30:00"
    topic: "tap_semantics, use_case, step_model, size_testing"
    agent_question: |
      Batch 1: (1) Tap semantics — in-execution text-branch (a) vs keyword-funnel routing (b);
      proposed buttons work via existing Phase-3 keyword mechanism. (2) Author's concrete use-case.
      (3) Model: separate SET_KEYBOARD/CLEAR_KEYBOARD steps (text mandatory — reply_markup attaches
      to a message) vs option on MESSAGE composer. (4) Size M + integration tests (sender wire format,
      webhook dispatch, engine) in slow lane, no E2E.
    user_answer: |
      1. Достатньо "клавіатура + keyword-воронки" (no in-execution text-wait branching this phase).
      2. Приклад: є клавіатура з кнопками, одна "Згенерувати бонус" → перекидає на воронку, де
         генерується бонус; там СВОЯ клавіатура, користувач проходить декілька ходів; після
         успішного або неуспішного результату повертається у воронку до (головної) клавіатури.
      3. Те що пропонуєш (окремі кроки SET_KEYBOARD / CLEAR_KEYBOARD).
      4. Погоджуюсь (M, integration у slow lane, без E2E).
    summary: "Keyword-routing only; bonus-game use-case with nested keyboards + return; separate set/clear steps; size M agreed"
  - question_num: 2
    timestamp: "2026-06-10 18:45:00"
    topic: "return_pattern, button_wiring, keyword_quirks, success_criteria"
    agent_question: |
      Batch 2: (1) Return to main keyboard = authoring pattern (SET_KEYBOARD at end of both
      branches), no engine keyboard-stack. (2) Button→funnel wiring: A pure convention vs
      B convention + editor hint (warning when no active keyword funnel matches button text).
      (3) Keyword quirks as conscious constraints: contains-match false positives on free text,
      menu precedence (waiting_for_reply suppresses keyword dispatch → bottom-keyboard taps
      ignored while an inline menu is parked), fan-out (one text may start N funnels).
      (4) Success criteria (a)-(e) + keyboard limits ≤10 rows × ≤4 buttons.
    user_answer: |
      1. Так, все правильно (authoring pattern, без стеку).
      2. Давай B (editor hint).
      3. Все нормально — приймаємо as-is; доведемо до логічного в процесі. Автор потестить на
         своїх реальних воронках і тоді скаже точно, чи все добре.
      4. Так, все підходить (критерії + ліміти).
      Додатково: по суті це має вийти "нескінченна воронка" (постійне меню, навігація без кінця),
      але є й кейси з кінцем (пройти тест тощо). Будуватимуть багато сценаріїв; приклади
      накидає пізніше, зараз під рукою немає.
    summary: "B wiring with editor hint; keyword quirks accepted as-is; criteria+limits approved; endless-menu + finite-quiz scenarios"
  - question_num: 3
    timestamp: "2026-06-10 19:10:00"
    topic: "preview, step_text_shape, keyboard_options, dead_button"
    agent_question: |
      Batch 3 (code-informed): (1) Extend preview (backend + frontend panel) to render keyboard
      steps' text via VariableTemplateRenderer + buttons list, vs neutral placeholder.
      (2) Step text = single text field (not composer blocks) with {user.*}/{custom.*} variables,
      parse_mode, 4096 cap; CLEAR_KEYBOARD text also mandatory (Telegram can't remove a keyboard
      without a message). (3) Keyboard options: resize=true hardcoded; form exposes two checkboxes —
      "Постійна" (is_persistent, default on) and "Сховати після натискання" (one_time, default off).
      (4) Dead button at runtime (keyword funnel deactivated later) → silent no-op, accept as-is.
    user_answer: |
      1. Розширити прев'ю на обидва нові кроки (текст через VariableTemplateRenderer + кнопки списком).
      2. Ок.
      3. У формі два чекбокси: "Постійна" (is_persistent, default on) і "Сховати після натискання"
         (one_time, default off).
      4. Згоден.
    summary: "Preview extended; single text field + variables + parse_mode; two option checkboxes; dead button silent no-op accepted"
  - question_num: 4
    timestamp: "2026-06-10 19:30:00"
    topic: "button_cap, duplicates, error_mapping, manual_checklist + deploy (user preempted)"
    agent_question: |
      User preempted between batches: "деплою немає, перевіряю все в ручну" (no deploy, manual
      verification). Batch 4: (1) Button text cap 64 chars (aligns with keyword ≤64 and inline
      MAX_BUTTON_LABEL=64). (2) Duplicate button labels within one keyboard — block at validation
      (422 + form mirror) vs allow. (3) Send errors: same mapping as all send steps
      (blocked → cancelled, other Telegram errors → failed), nothing special. (4) Written manual
      checklist (staging-smoke style) or author verifies his own way?
    user_answer: |
      1. Ок (cap 64).
      2. Блокуй (validation 422 + form mirror).
      3. Так (existing mapping, nothing special).
      4. Так — створити smoke.md прямо в корені задачі (work/16-persistent-keyboard/smoke.md).
    summary: "Cap 64; duplicates blocked; existing error mapping; smoke.md checklist in feature root; no deploy, manual verification"
# Format:
# - question_num: 1
