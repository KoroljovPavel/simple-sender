# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
# Interview Cycle 1 scope
phase1_feature_overview:

  feature_name:
    score: 95
    status: "complete"
    value: "16-persistent-keyboard (roadmap Phase 7, Epic 7 in funnels-future-epics.md)"
    gaps: ""
    required: true

  feature_description:
    score: 90
    status: "complete"
    value: >
      Persistent bottom reply keyboard (ReplyKeyboardMarkup, NOT inline). Two new fire-and-forget
      step types: SET_KEYBOARD (mandatory text + reply_markup.keyboard rows; checkboxes
      is_persistent/one_time, resize hardcoded) and CLEAR_KEYBOARD (mandatory text +
      remove_keyboard). NO in-execution text-wait branching — taps route via existing Phase-3
      keyword funnels. Wiring = text convention + non-blocking editor hint. Return-to-menu =
      authoring pattern. TelegramSender needs NO change (sendText already takes replyMarkup).
      Preview extended for both steps.
    gaps: ""
    required: true

  work_type:
    score: 95
    status: "complete"
    value: "feature"
    gaps: ""
    required: true

  user_problem:
    score: 85
    status: "complete"
    value: >
      Concrete author use-case (bonus game): main persistent keyboard with buttons incl.
      "Згенерувати бонус" → tap routes to a bonus-generation funnel which sets ITS OWN
      keyboard; subscriber makes several moves; on success or failure returns to the main
      keyboard funnel. Persistent menu = always-available navigation (inline MENU scrolls away).
    gaps: ""
    required: true

  target_users:
    score: 0
    status: "pending"
    value: ""
    gaps: "Who specifically will use this"
    required: false

  success_criteria:
    score: 85
    status: "complete"
    value: >
      (a) Author adds SET_KEYBOARD step (button rows, ≤10 rows × ≤4 buttons) in the editor;
      (b) subscriber sees the persistent bottom keyboard, it survives execution completion;
      (c) button tap starts the matching keyword funnel; (d) CLEAR_KEYBOARD removes it;
      (e) the bonus-game scenario assembles end-to-end from existing primitives
      (keyword funnels + SET_KEYBOARD at end of both success/failure branches).
      Both endless-menu navigation and finite (quiz-like) funnels must be buildable.
    gaps: ""
    required: true

  constraints:
    score: 90
    status: "complete"
    value: >
      Consciously accepted as-is (author will validate on real funnels): contains-match
      false positives on free text; menu precedence (parked waiting_for_reply suppresses
      keyword dispatch → keyboard taps ignored while an inline menu is parked); fan-out
      (one text may start N keyword funnels). reply_markup attaches only to a message →
      both steps send mandatory text. Limits: ≤10 rows × ≤4 buttons, button text ≤64
      (= keyword cap), duplicates blocked. No keyboard stack/auto-restore. Re-enter
      resolved: repeat tap with allowReEnter=false = benign no-op, =true = restart.
      No deploy environment — manual verification only.
    gaps: ""
    required: true

  testing_strategy:
    score: 85
    status: "complete"
    value: >
      Size M. Integration tests mandatory: TelegramSender wire format (reply_markup.keyboard,
      ReplyKeyboardRemove), webhook text-dispatch to keyword funnels, engine step execution —
      engine ITs in slow lane (@Tag("slow"), like Phase 6). No E2E — frontend covered by
      Vitest component specs of the step form. User agreed.
    gaps: ""
    required: true

# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
# Interview Cycle 2 scope (together with Phase 3)
phase2_user_experience:

  user_stories:
    score: 85
    status: "complete"
    value: >
      (1) Author adds SET_KEYBOARD to a main-menu funnel: text + button rows + two checkboxes
      (persistent on, one-time off); activates; subscriber gets the message and a persistent
      bottom keyboard. (2) Subscriber taps "Згенерувати бонус" → text goes to webhook →
      keyword funnel (bonus game) starts; that funnel sets ITS OWN keyboard; at the end of
      both success/failure branches a SET_KEYBOARD restores the main menu. (3) Author adds
      CLEAR_KEYBOARD ("Меню сховано") → keyboard disappears for the subscriber.
      (4) While editing, author sees a non-blocking warning on buttons whose text matches
      no active keyword funnel. (5) Both endless-menu and finite quiz funnels buildable.
    gaps: ""
    required: true

  acceptance_criteria:
    score: 90
    status: "complete"
    value: >
      From batches 2-4: (a) SET_KEYBOARD step in editor: text (≤4096, variables, parse_mode),
      ≤10 rows × ≤4 buttons, button text ≤64, duplicate labels blocked (422 + form mirror),
      checkboxes is_persistent (default on) / one_time (default off), resize hardcoded true;
      (b) subscriber sees persistent bottom keyboard surviving execution completion;
      (c) tap starts matching keyword funnel via existing dispatch; (d) CLEAR_KEYBOARD
      (mandatory text) removes keyboard; (e) bonus-game scenario buildable end-to-end;
      (f) preview renders both steps (rendered text + buttons list); (g) editor hint
      (non-blocking) when button text matches no active keyword funnel; (h) smoke.md
      manual checklist in feature root.
    gaps: ""
    required: true

  edge_cases:
    score: 70
    status: "partial"
    value: >
      Covered: repeat tap while in-flight (re-enter guard no-op / restart); dead button after
      funnel deactivation (silent no-op, accepted); tap suppressed while parked on inline menu
      (menu precedence, accepted); fan-out N funnels per tap (accepted); emoji in button text
      (just text, matches if keyword set accordingly); CLEAR with no keyboard set (harmless);
      duplicate button labels in one keyboard → blocked at validation; button text cap 64 =
      keyword cap 64 (a button text can always be an exact keyword).
    gaps: ""
    required: true

  error_scenarios:
    score: 90
    status: "complete"
    value: >
      Confirmed by user: Telegram send failure on keyboard steps follows existing StepExecutor
      mapping (BLOCKED_BY_USER/CHAT_NOT_FOUND → cancelled; other Telegram errors → failed;
      invalid_bot_token → failed). Validation errors → 422 funnel_step_invalid (mirrored in
      form). Editor hint non-blocking. Dead button at runtime → silent no-op.
    gaps: ""
    required: true

  verification_strategy:
    score: 90
    status: "complete"
    value: >
      No deploy environment — author verifies everything MANUALLY on his own setup
      (real Telegram bot; reply keyboard renders only in a real client). Agent-side
      verification during development: unit tests (StepExecutor reply_markup map,
      validateSteps, copyOf), slow-lane engine ITs asserting the /sendMessage wire body
      (reply_markup.keyboard / remove_keyboard), frontend Vitest specs. "Test for me"
      (Phase 4 test-run) works for keyboard steps too. Deliverable: smoke.md manual
      checklist in the feature root (work/16-persistent-keyboard/smoke.md) — connected bot →
      activate menu funnel → tap → bonus scenario → CLEAR.
    gaps: ""
    required: true

  ui_ux_requirements:
    score: 85
    status: "complete"
    value: >
      Step form follows existing FunnelStepForm idioms (local reactive rows array like
      menuButtons/blocks, hand-validated on submit, inline errors, i18n uk+en).
      Two checkboxes: "Постійна" (is_persistent, default on), "Сховати після натискання"
      (one_time, default off); resize_keyboard hardcoded true. Non-blocking per-button hint
      when no active keyword funnel matches (computed client-side from funnels store).
      Preview panel renders text + buttons list for both steps. Desktop-first editor (existing).
    gaps: ""
    required: false

  risks:
    score: 85
    status: "complete"
    value: >
      (1) FunnelStep.copyOf misses new fields → keyboard silently dropped from snapshot/duplicate
      — mitigated by copyOf unit tests (load-bearing, flagged in code research).
      (2) Contains-match false positives: free text containing a keyword starts a menu funnel —
      accepted as-is; author validates on real funnels and reports.
      (3) Menu precedence: keyboard taps suppressed while parked on an inline menu — accepted,
      documented.
      (4) Hint can mislead if author renames button after wiring — hint recomputes live from
      store, non-blocking by design.
      (5) Reply keyboard renders only in real clients → manual smoke.md pass is the final gate.
    gaps: ""
    required: true

  technical_decisions:
    score: 90
    status: "complete"
    value: >
      D1: New step types SET_KEYBOARD/CLEAR_KEYBOARD (not riding MESSAGE — inline buttons
      couple to park-on-reply, opposite semantics). D2: No new branching — taps route via
      Phase-3 keyword dispatch (contains-match). D3: No keyboard stack/auto-restore — return
      is an authoring pattern (SET_KEYBOARD at end of branches). D4: Button→funnel wiring =
      text convention + non-blocking client-side editor hint (no new endpoint). D5: Steps are
      fire-and-forget (Outcome CONTINUE, never park). D6: TelegramSender unchanged (6-arg
      sendText Object replyMarkup). D7: Single text field + VariableTemplateRenderer +
      parse_mode (not composer blocks). D8: resize=true hardcoded; is_persistent/one_time
      exposed. D9: Caps: ≤10 rows, ≤4 buttons/row, button text ≤64 (= keyword cap),
      duplicates blocked. D10: Preview extended for both steps. D11: No migration (additive
      nullable fields). D12: No E2E; unit + slow-lane ITs + Vitest; manual smoke.md.
    gaps: ""
    required: false

  deploy_approach:
    score: 85
    status: "complete"
    value: >
      No deploy (user: "деплою немає, перевіряю все в ручну"). Same situation as Phase 6 —
      no target environment yet; code lands on main. Unlike Phase 6, NO data wipe / migration
      needed: new step types are additive nullable fields, existing funnels unaffected.
    gaps: ""
    required: false

  manual_user_actions:
    score: 85
    status: "complete"
    value: >
      No new env vars, no new external services. To verify manually the author needs his
      existing connected Telegram bot (+ ngrok/local webhook as in existing runbooks) and
      keyword funnels wired to button texts. Author will assemble his real funnels and test
      on his own conditions (stated in batch 2).
    gaps: ""
    required: false

