# ============================================================================
# Notes
# ============================================================================
notes: |
  PIVOT (user-approved): Epic 8 split into #17 (model+engine+minimal list editor) and
  #18-funnel-canvas (editable Vue Flow canvas, variant C). Roadmap funnels.md needs updating:
  Phase 8 narrowed to the model; a new canvas phase inserted before the variable-picker phase.

  KEY SEMANTIC (user msg 3 + screenshot): NOT N independent fresh entry points. There is ONE
  execution per funnel per subscriber. A trigger node inside the graph, when its event fires,
  REDIRECTS the in-flight execution's currentStepId to the trigger's branch. The API-driven
  "enter mid-funnel" (msg 2) is the same mechanism via API events. => keep "one in-flight per
  funnel" guard, NO parallel-execution index relax. This is much cheaper than the roadmap's
  original "disconnected fresh entries" framing.

  CAUTION: moving a live execution's currentStepId is the unsafe part flagged under "Funnel
  versioning" in funnels.md. Here it is SAFE because (a) the trigger names an explicit target
  step id, no ambiguous remap, and (b) the execution snapshot already deep-copies ALL funnel
  steps incl. trigger-reachable ones — so the target id exists in the snapshot.

  Libraries (for #18, not #17): Vue Flow (@vue-flow/core + background/controls/minimap) +
  @dagrejs/dagre for auto-layout. No graph libs in frontend/package.json yet.

# ============================================================================
# USAGE INSTRUCTIONS
# ============================================================================
#
# 1. INIT: Created by init-feature-folder.sh at work/{feature}/logs/userspec/interview.yml
#    Set metadata.started, metadata.status: in_progress
#
# 2. INITIAL SCORING: After user's free-form description, score ALL items
#    Detailed 80-95%, brief 50-70%, vague 20-40%, not mentioned 0%
#
# 3. INTERVIEW LOOP (save after EVERY response):
#    a) Find required items with score < 85% in current cycle scope
#    b) Ask 3-4 questions about different gaps
#    c) Propose solutions based on PK
#    d) User answers
#    e) Update: conversation_history, scores, values, gaps, metadata
#    f) Save immediately
#    g) Check stop criteria (score >= 85% AND structural: value filled, no TBD, gaps resolved)
#    h) Not done → repeat. Done → next cycle.
#
# 4. CYCLES:
#    Cycle 1: phase1_feature_overview items
#    Cycle 2: phase2_user_experience + phase3_integration items
#    Cycle 3: ALL items still below threshold (cleanup pass)
#
# 5. RESUME: If metadata.status is "in_progress"
#    Load, show conversation summary, resume from current state
#
# 6. COMPLETION: After user approves user-spec.md
#    Set phase4_completion.status: approved
#    Set metadata.status: completed
