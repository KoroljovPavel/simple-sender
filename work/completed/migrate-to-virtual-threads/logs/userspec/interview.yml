      6. After cleanup PRs: review and merge updated `patterns.md` (AC14).

      No new external services to register. No new API keys. No BotFather
      re-registration. Telegram base URL and webhook URLs unchanged.
    gaps: ""
    required: false

# ============================================================================
# Phase 3: Integration & Technical Context
# ============================================================================
# Interview Cycle 2 scope (together with Phase 2)
phase3_integration:

  integration_points:
    score: 90
    status: "complete"
    value: |
      Touches every backend module. Per-module impact:
      - `common/` — GlobalErrorHandler exception type swap; new home for
        `REMEMBER_ME_ATTR` constant.
      - `email/` — EmailService.sendAsync drops boundedElastic wrapper.
      - `events/` — EventService drops Mono variant; EventRepository becomes
        MongoRepository<Event,String>.
      - `user/` — UserRepository becomes MongoRepository; finders return
        Optional / List.
      - `auth/` — AuthService 650-LOC rewrite (largest single file change);
        AuthController returns ResponseEntity directly.
      - `project/` — ProjectController.list returns List (not streaming).
      - `bot/` — TelegramApiClient and TelegramSender rewritten on RestClient
        + hand-rolled retry loops; BotService chain becomes sync.
      - `profile/` — ProfileService sync; ServerWebExchange usages → HttpServletRequest.
      - `webhook/` — WebhookPayloadSizeFilter as OncePerRequestFilter;
        TelegramWebhookController returns ResponseEntity; ProcessTelegramUpdateJob
        drops .block() calls.
      - `security/` — SecurityConfig full rewrite; RememberMeCookieSerializer
        replaces RememberMeWebSessionIdResolver.
      - `jobs/` — HardDeleteJob / ProjectHardDeleteJob already use .block();
        becomes direct sync.
      - `admin/` — SuperAdminSeeder already uses .block(); becomes sync.
      - `subscriber/`, `funnel/` — stubs only; Mono.empty() → null/void.

      External integration points unchanged: Telegram Bot API (HTTPS, same
      shape), MongoDB (same collections, same schemas), Redis (same keys),
      SMTP (Mailpit dev / TBD prod), JobRunr (same worker shape).
    gaps: ""
    required: true

  dependencies:
    score: 95
    status: "complete"
    value: |
      Build dependencies that change (atomic flip):
      - REMOVE: spring-boot-starter-webflux, spring-boot-starter-data-mongodb-reactive,
        spring-boot-starter-data-redis-reactive, io.projectreactor:reactor-test
      - ADD: spring-boot-starter-web, spring-boot-starter-data-mongodb,
        spring-boot-starter-data-redis
      Unchanged: spring-boot-starter-security (works on both stacks),
      spring-session-data-mongodb (ships both servlet + reactive autoconfig,
      Boot picks per WebApplicationType), spring-boot-starter-mail,
      spring-boot-starter-validation, jobrunr-spring-boot-3-starter,
      micrometer-core, mongodb-driver-sync (already present for JobRunr),
      testImplementation: spring-boot-starter-test, spring-security-test,
      testcontainers:mongodb, testcontainers:junit-jupiter,
      testcontainers-mailpit, okhttp3:mockwebserver.
      Java toolchain stays at 21. Spring Boot version stays at 3.5.0.
    gaps: ""
    required: false

  technical_constraints:
    score: 90
    status: "complete"
    value: |
      - Java 21 already in use (`java.toolchain.languageVersion = 21`) — virtual
        threads available.
      - Spring Boot 3.5.0 — virtual threads supported via
        `spring.threads.virtual.enabled=true`.
      - WebFlux and Web starters are MUTUALLY EXCLUSIVE on classpath (Spring
        Boot fails fast). Forces atomic flip.
      - WebSession / ServerWebExchange / Mono / Flux / Reactor types disappear
        from classpath the moment WebFlux is removed — any pre-flip module that
        still imports them breaks.
      - Existing Epic 04b SLA: P99 webhook latency < 100ms must hold.
      - JobRunr `jobrunr-spring-boot-3-starter` not compatible with Spring Boot 4.x
        (current version 7.3.2 fine for 3.5.0).
      - No Lombok added (D8).
    gaps: ""
    required: false

  data_requirements:
    score: 90
    status: "complete"
    value: |
      No data migration. MongoDB collections and Redis keys unchanged:
      - `sessions` — `spring-session-data-mongodb` keeps same document shape
        across servlet/reactive variants (verified in code-research §3.3).
        `principal` field path preserved (used by `terminate-sessions` flows).
      - `users`, `projects`, `bots`, `raw_updates`, `events`, `jobrunr_*` —
        no schema change.
      - All indexes (compound, partial unique, TTL on `raw_updates`,
        TTL on `sessions`) unchanged.
      - Redis keys (`brute:fail:{email}`, `brute:fail:ip:{ip}`,
        `brute:bot-connect:{userId}`, etc.) unchanged.

      Pre-existing in-flight sessions (R5) and in-flight JobRunr jobs (R6) are
      compatibility concerns, addressed in `risks` and `edge_cases`.
    gaps: ""
    required: false

  migration_needs:
    score: 90
    status: "complete"
    value: |
      No user-facing migration. No DB migration script. No frontend changes.
      No external service re-registration. Operator runbook (in
      manual_user_actions): drain JobRunr queue + run smoke runbooks before
      flip.
    gaps: ""
    required: false

