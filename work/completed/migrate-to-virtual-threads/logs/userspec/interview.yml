           Reactor `Flux.range(0,2).parallel(2)` rewritten via VT executor.
      EC3. Webhook ingestion idempotency: duplicate `(projectId, updateId)` produces
           DuplicateKeyException → 200 + re-enqueue with deterministic JobRunr UUID.
      EC4. JobRunr worker retry overlap: DONE re-entry guard short-circuits before
           audit/stub side-effects.
      EC5. RememberMe under post-flip code path: legacy pre-flip sessions in MongoDB
           (no rememberMe attribute) deserialize cleanly and continue to work.
      EC6. JobRunr in-flight `ProcessTelegramUpdateJob` lambdas serialized pre-flip
