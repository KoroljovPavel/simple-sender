# ============================================================================
# Phase 1: High-Level Feature Understanding
# ============================================================================
# Interview Cycle 1 scope
phase1_feature_overview:

  feature_name:
    score: 100
    status: "complete"
    value: "migrate-to-virtual-threads"
    gaps: ""
    required: true

  feature_description:
    score: 95
    status: "complete"
    value: |
      Full migration of backend stack from Spring WebFlux (reactive Netty + Reactor)
      to Spring MVC + Java 21 virtual threads. Replace reactive Mongo/Redis with
      blocking variants. Rewrite all reactive controllers/services/repositories to
      blocking style. Migrate all StepVerifier/WebTestClient tests to plain assertions
      and MockMvc. Lombok NOT added (Java 21 records + ctor-injection sufficient).
      Strangler-fig per-module migration; incremental merge allowed.
    gaps: ""
    required: true

  work_type:
    score: 100
    status: "complete"
    value: "refactoring"
    gaps: ""
    required: true

  user_problem:
    score: 90
    status: "complete"
    value: |
      No current production pain. Motivation grounded in four concrete future wins:
      (a) blocking stack-traces are easier to debug than reactor chains;
      (b) tests easier to write without StepVerifier/WebTestClient wrappers;
      (c) JobRunr workers are already blocking — virtual threads remove the
          reactive/blocking impedance currently bridged by Mono.fromCallable + boundedElastic;
      (d) future MVP features (broadcast, analytics) will be simpler to implement
          without an entrenched reactive pocket. Multi-instance horizontal scaling
          planned — VT scaling-per-instance win is not the driver.
    gaps: ""
    required: true

  target_users:
    score: 85
    status: "complete"
    value: |
      Solo developer/maintainer (current). Future devs onboarding to the codebase.
      End users (bot funnel customers) not directly affected.
    gaps: ""
    required: false

  success_criteria:
    score: 95
    status: "complete"
    value: |
      Required (all 7):
      1. All existing test files pass (52 files; reactive tests rewritten to MockMvc + plain assertions).
      2. All ACs from 8 completed epics (01-08) remain satisfied — verified via
         re-running their test suites + relevant staging smoke runbooks.
      3. P99 webhook latency <100ms (Epic 04b SLA — slow-tagged test must pass).
      4. application.properties contains spring.threads.virtual.enabled=true.
      5. Zero remnants of Mono / Flux / StepVerifier / WebTestClient / Reactive*
         imports in main and test source (grep gate).
      6. Lombok NOT added (Java 21 records + ctor-injection are sufficient).
      7. Staging smoke runbooks 06-bot-connection, 07-telegram-sender,
         08-webhook-ingestion all pass manually before merge to main.
      Out of scope: load benchmark — deferred until prod load profile justifies it.
    gaps: ""
    required: true

  constraints:
    score: 90
    status: "complete"
    value: |
      - No deadline.
      - Dev env may break temporarily during migration (single dev, no parallel work).
      - Incremental merge to main allowed: module-by-module via separate PRs.
        Mixed architecture (some modules reactive, some blocking) is acceptable
        for the duration of migration, bridged by .block() calls where needed.
      - No in-flight features from other devs to coordinate.
      - 8 completed-epic ACs are hard constraint (must remain satisfied).
      - Epic 04b P99 <100ms SLA is hard constraint.
    gaps: ""
    required: true

  testing_strategy:
    score: 95
    status: "complete"
    value: |
      Strangler-fig per-module approach:
      1. Migrate modules in dependency order (likely: common → email → events → user →
         auth → project → bot → webhook → profile → subscriber/funnel stubs →
         security config + main app + properties as the final flip).
      2. After each module: full ./gradlew test must pass (including the slow-tagged
         P99 latency probe via -PrunSlow=true for the webhook module milestone).
      3. Reactive modules call blocking modules directly (no special bridge);
         blocking modules call still-reactive modules via .block() inside a
         Mono.fromCallable + boundedElastic wrapper if needed (only relevant
         intra-migration; final state has no reactive modules).
      4. Each migrated test file: convert StepVerifier → plain JUnit assertions,
         WebTestClient → MockMvc, ReactiveMongoTemplate query asserts → MongoTemplate.
      5. No new tests added for VT-specific behavior — existing coverage suffices.
      6. Integration tests (currently @SpringBootTest WebEnvironment.RANDOM_PORT +
         WebTestClient) become @SpringBootTest + MockMvc / TestRestTemplate.
      7. MockWebServer-based bot module tests stay as-is (transport-agnostic).
    gaps: ""
    required: true

