    gaps: ""
    required: true

  ui_ux_requirements:
    score: 100
    status: "complete"
    value: |
      None. Backend-only refactor. Frontend unchanged. UI behaviour MUST remain
      identical (cookies, status codes, error response bodies, CSRF interaction).
    gaps: ""
    required: false

  risks:
    score: 95
    status: "complete"
    value: |
      R1. **VT pinning** on BCrypt and Lettuce internal `synchronized` blocks
          (pre-Java 24 carrier thread). Impact unknown. Mitigation: document
          via `-Djdk.tracePinnedThreads=full` boot probe; not blocker.
      R2. **Lettuce sync API under VT** — blocks calling VT on Netty
          CompletableFuture. Documented VT happy-path; no risk. Documented for
          posterity only.
      R3. **Spring Session schema continuity** — `sessions` collection retains
          the `principal` field path used by AuthService/ProfileService for
          terminate-sessions queries. Verified in code-research; addressed via
          explicit integration test on the migrated AuthService.
      R4. **CSRF cookie write path** — `CsrfFilter` eagerly writes XSRF-TOKEN
          (vs current deferred WebFilter materialiser). If frontend fails to
          read cookie → POST/PUT/DELETE 403. Addressed by integration test
          (existing CSRF test ported) + AC11-13 manual UI smoke.
      R5. **In-flight session bytes-shape** — pre-flip `SecurityContext`
          serialised by `ReactiveMongoSessionRepository` must deserialize under
          new servlet `MongoIndexedSessionRepository`. Mitigation: dev-env
          test (log in, redeploy, refresh page — must stay logged in). If
          deserialization breaks → users force-relogin (acceptable one-time
          impact given no production users yet, but documented).
      R6. **JobRunr in-flight jobs** — pre-flip lambda serialization may diverge
          from post-flip (handle(String) signature stable, but lambda capture
          context may differ). Mitigation: drain JobRunr queue to zero before
          flip (manual op), verify post-flip via integration test for the
          worker entrypoint.
    gaps: ""
    required: true

  technical_decisions:
    score: 90
    status: "complete"
    value: |
      D1. WebClient replacement: Spring 6.x **RestClient** (sync, autoconfig-compatible).
          Rationale: smallest API delta from WebClient; MockWebServer-based bot tests
          carry over unchanged.
      D2. Retry: **hand-rolled while-loop + Thread.sleep**. Rationale: 2 clients only,
          domain-specific invariants (429 wraps 5xx, clamped retry_after, jitter)
          easier to read explicitly than as Spring Retry annotations; VT makes
          Thread.sleep cheap.
      D3. RememberMe redesign: subclass `DefaultCookieSerializer` (Spring Session)
          + branch Max-Age on a request attribute. Rationale: Spring Session exposes
          a public API for this; avoids servlet response wrapping.
      D4. BCrypt back-pressure under VT: do nothing now. Rationale: current
          `boundedElastic` already caps at ~10×CPU; not a regression. Reactive
          mitigation (Semaphore) deferred until prod load profile demands it.
      D5. Atomic flip is non-divisible — build.gradle + cookie property prefix +
          SecurityConfig + RememberMe + WebhookPayloadSizeFilter must land in
          one commit. Strangler-fig applies only to services/repos ahead of that
          commit.
      D6. ProjectController.list streaming response (Flux<ProjectResponse>) collapses
          to List<ProjectResponse>. Lossless for MVP — projects capped at 5 per user.
          (To be confirmed in Q9.)
      D7. Move `REMEMBER_ME_ATTR` constant from `security/RememberMeWebSessionIdResolver`
          to `common/` before either auth or security migration step, to break the
          auth → security circular dependency on a migration boundary.
      D8. Lombok NOT added.
      D9. AbstractIntegrationTest + all 12 IT files migrate inside the atomic
          flip PR. Pre-flip module PRs touch only unit tests (StepVerifier
          rewrites in service-layer tests). No parallel base class fork.
      D10. Concurrency test idiom under VT: `Executors.newVirtualThreadPerTaskExecutor()`
          + `CountDownLatch` used uniformly for all three sites
          (BotControllerIT parallel-connect race, AuthServicePasswordResetTest
          parallel-reset, TelegramWebhookControllerIT parallel-receive).
      D11. JobRunrMongoConfig dual MongoClient setup kept as-is (sync client
          already, no consolidation).
    gaps: ""
    required: false

  deploy_approach:
    score: 90
    status: "complete"
    value: |
      Phased delivery (no CI/CD yet — deployment.md "TBD"):
      1. feature branch `feature/migrate-to-virtual-threads`.
      2. **Pre-flip PRs (one per module)** — service + repository layer migrated
         to blocking API while controllers still call `.block()`. Each PR is
         green via `./gradlew test`. Order: common → email → events → security
         (REMEMBER_ME_ATTR move to common) → user → subscriber/funnel stubs →
         auth → project → profile → jobs → bot → webhook.
      3. **Atomic flip PR** — single commit containing:
         - `build.gradle` (3 starter swaps, drop reactor-test)
         - `application.properties` (cookie prefix flip; add `spring.threads.virtual.enabled=true`)
         - `security/SecurityConfig.java` (rewrite for servlet)
         - `security/RememberMeWebSessionIdResolver.java` → new
           `RememberMeCookieSerializer` (DefaultCookieSerializer subclass)
         - `webhook/WebhookPayloadSizeFilter.java` (OncePerRequestFilter)
         - `common/GlobalErrorHandler.java` (WebExchangeBindException →
           MethodArgumentNotValidException)
         - All controllers signature flip (`Mono<ResponseEntity<...>>` → bare)
         - All repos `Reactive*Repository` → `MongoRepository`
         - All `*Service` reactive return-types collapsed
         - `HealthController.java` Mono unwrap
         Local smoke runbooks 06/07/08 must pass before merging this PR.
      4. **Cleanup PRs** — drop `boundedElastic` wrappers in EmailService,
         AuthService, ProfileService; remove `Mono.fromCallable` in
         TelegramWebhookController; update `patterns.md` (AC14).

      No production deploy involved — production hosting TBD; the migration is
      a code-quality and developer-ergonomics change for the current local-dev
      + staging-smoke workflow.
    gaps: ""
    required: false

  manual_user_actions:
    score: 88
    status: "complete"
    value: |
      Operator/maintainer manual steps:
      1. Pre-flip: drain JobRunr queue to zero (manual mongosh inspection or
         pause `BackgroundJobServer`) — addresses R6.
      2. Pre-flip: optional — log in via UI on dev env so post-flip session
