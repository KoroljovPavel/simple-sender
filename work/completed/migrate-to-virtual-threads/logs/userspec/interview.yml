  edge_cases:
    score: 90
    status: "complete"
    value: |
      EC1. `ProjectController.list` for users with 0 projects → empty `[]` JSON array (not `null`).
      EC2. Concurrent bot-connect race (Decision 22 in 06 epic): existing race test
