      EC8. Login brute-force counter (`brute:fail:{email}`): under VT each request
           is its own VT — counter increment semantics unchanged (Redis is the
           source of truth, not in-JVM state).
    gaps: ""
    required: true

  error_scenarios:
    score: 88
    status: "complete"
    value: |
      ERR1. Build fails if both `spring-boot-starter-webflux` and `spring-boot-starter-web`
            are on classpath simultaneously (Spring Boot fails fast). Expected mid-migration
            during the atomic flip — never on `main`.
      ERR2. Redis unreachable: rate-limit counters fail-open (WARN log, login still succeeds).
